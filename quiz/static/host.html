<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Квиз — ведущий</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen stage for a TV — top bar, big centered content, action button bottom-right */
:root {
  --bg: #111735;
  --panel: #1b2350;
  --ink: #f3f5ff;
  --muted: #a3abd6;
  --line: #2e3874;
  --accent: #ffd23f;
  --accent-ink: #1a1400;
  --a0: #e5484d; --a1: #3e7bfa; --a2: #f2a516; --a3: #26a269;
  --good: #3ddc84; --bad: #ff6b6b;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body);
  font-size: clamp(16px, 1.6vw, 22px); padding: 24px 16px;
}
.stage { max-width: 1200px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; color: var(--muted); }
.brand { font-family: var(--display); font-weight: 800; color: var(--ink); font-size: 1.1em; }
main { flex: 1; display: flex; flex-direction: column; gap: 28px; justify-content: center; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(30px, 5vw, 64px); font-weight: 800; }
h2 { font-size: clamp(24px, 3.6vw, 48px); font-weight: 500; }
.muted { color: var(--muted); }

.join { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
.join-text { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.join-url { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 4vw, 52px); color: var(--accent); word-break: break-all; }
#qr { background: #fff; padding: 12px; border-radius: 12px; line-height: 0; }
#qr:empty { display: none; }

.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  font: 700 1em var(--body); padding: 8px 16px; border-radius: 999px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); cursor: pointer;
}
.chip:hover { border-color: var(--bad); text-decoration: line-through; }

.timer { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 6vw, 80px); color: var(--accent); font-variant-numeric: tabular-nums; }
.qhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.opt {
  display: flex; align-items: center; gap: 14px; padding: 22px 24px; border-radius: 14px;
  font-weight: 800; font-size: 1.2em; color: #fff; min-width: 0; position: relative; overflow: hidden;
}
.opt .shape { font-size: 1.1em; flex: none; }
.opt .label { min-width: 0; flex: 1; position: relative; }
.opt .count { position: relative; font-family: var(--display); font-variant-numeric: tabular-nums; }
.opt.c0 { background: var(--a0); } .opt.c1 { background: var(--a1); }
.opt.c2 { background: var(--a2); } .opt.c3 { background: var(--a3); }
.opt.dim { opacity: .28; }
.opt.right { outline: 4px solid var(--ink); outline-offset: 3px; }

.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-width: 720px; width: 100%; }
.board li {
  display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-radius: 12px;
  background: var(--panel); font-weight: 700; font-variant-numeric: tabular-nums;
}
.board .pos { font-family: var(--display); color: var(--muted); width: 2ch; }
.board .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.board .plus { color: var(--good); }
.board li:first-child .pos { color: var(--accent); }

.podium { display: flex; justify-content: center; align-items: flex-end; gap: 14px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(220px, 30%); }
.step .nm { font-weight: 800; text-align: center; overflow-wrap: anywhere; }
.step .block {
  width: 100%; border-radius: 12px 12px 0 0; background: var(--panel); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 14px;
  font-family: var(--display); font-weight: 800;
}
.step .block small { font-family: var(--body); color: var(--muted); font-weight: 700; margin-top: 6px; }
.step.p1 .block { height: 200px; background: var(--accent); color: var(--accent-ink); border: 0; }
.step.p1 .block small { color: var(--accent-ink); }
.step.p2 .block { height: 150px; } .step.p3 .block { height: 110px; }

.actions { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
.btn {
  font: 800 1.05em var(--body); padding: 16px 28px; border-radius: 14px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.error { color: var(--bad); }

@media (max-width: 640px) {
  .options { grid-template-columns: 1fr; }
  .qhead { flex-direction: column; gap: 8px; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <span class="brand" id="brand">Квиз</span>
    <span id="progress"></span>
  </div>
  <main id="main"><h2 class="muted">Подключаюсь к серверу…</h2></main>
  <div class="actions" id="actions"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SHAPES = ["▲", "◆", "●", "■"];
const key = new URLSearchParams(location.search).get("key") || "";
const $main = document.getElementById("main");
const $actions = document.getElementById("actions");
let lastSig = "", lastState = null;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function post(action, extra = {}) {
  const r = await fetch("/api/host/" + action, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key, ...extra }),
  });
  return r.json();
}

function joinUrl(s) { return s.join || location.origin; }

function options(s, reveal) {
  return `<div class="options">${s.options.map((o, i) => {
    const cls = reveal ? (i === s.correct ? "right" : "dim") : "";
    const count = reveal ? `<span class="count">${s.counts[i]}</span>` : "";
    return `<div class="opt c${i} ${cls}"><span class="shape">${SHAPES[i]}</span><span class="label">${esc(o)}</span>${count}</div>`;
  }).join("")}</div>`;
}

function board(players, limit, showPlus) {
  return `<ol class="board">${players.slice(0, limit).map((p, i) => `
    <li><span class="pos">${i + 1}</span><span class="nm">${esc(p.name)}</span>
    ${showPlus && p.last ? `<span class="plus">+${p.last}</span>` : ""}<span>${p.score}</span></li>`).join("")}</ol>`;
}

function render(s) {
  document.getElementById("brand").textContent = s.title;
  document.title = s.title + " — ведущий";
  const prog = document.getElementById("progress");
  prog.textContent = s.index >= 0 && s.phase !== "final" ? `Вопрос ${s.index + 1} из ${s.total}` : `Игроков: ${s.players.length}`;

  if (s.phase === "lobby") {
    const url = joinUrl(s);
    $main.innerHTML = `
      <h1>Заходите в игру!</h1>
      <div class="join">
        <div id="qr"></div>
        <div class="join-text">
          <span class="muted">Открой на телефоне:</span>
          <span class="join-url">${esc(url.replace(/^https?:\/\//, ""))}</span>
          <span class="muted">и введи своё имя</span>
        </div>
      </div>
      <div>
        <p class="muted">${s.players.length ? "В игре (нажми на имя, чтобы убрать):" : "Пока никого нет. Ждём игроков…"}</p>
        <div class="chips">${s.players.map((p) => `<button class="chip" data-kick="${esc(p.id)}">${esc(p.name)}</button>`).join("")}</div>
      </div>`;
    if (window.QRCode) new QRCode(document.getElementById("qr"), { text: url, width: 180, height: 180 });
    $actions.innerHTML = `<button class="btn" data-act="next" ${s.players.length ? "" : "disabled"}>Начать игру</button>`;
  } else if (s.phase === "question") {
    $main.innerHTML = `
      <div class="qhead"><h2>${esc(s.question)}</h2><span class="timer" id="timer">${Math.ceil(s.left)}</span></div>
      ${options(s, false)}
      <p class="muted" id="answered">Ответили: ${s.answered} из ${s.players.length}</p>`;
    $actions.innerHTML = `<button class="btn ghost" data-act="next">Показать ответ</button>`;
  } else if (s.phase === "reveal") {
    const last = s.index + 1 >= s.total;
    $main.innerHTML = `
      <h2>${esc(s.question)}</h2>
      ${options(s, true)}
      ${board(s.players, 5, true)}`;
    $actions.innerHTML = `<button class="btn" data-act="next">${last ? "Итоги" : "Следующий вопрос"}</button>`;
  } else if (s.phase === "final") {
    const [p1, p2, p3] = s.players;
    const step = (p, n) => p ? `<div class="step p${n}"><span class="nm">${esc(p.name)}</span><div class="block">${n}<small>${p.score}</small></div></div>` : "";
    $main.innerHTML = `
      <h1>Итоги</h1>
      <div class="podium">${step(p2, 2)}${step(p1, 1)}${step(p3, 3)}</div>
      ${s.players.length > 3 ? board(s.players, 50, false) : ""}`;
    $actions.innerHTML = `<button class="btn" data-act="reset">Сыграть ещё раз</button>`;
  }
}

async function poll() {
  try {
    const s = await (await fetch("/api/state", { cache: "no-store" })).json();
    lastState = s;
    const sig = JSON.stringify([s.phase, s.index, s.players, s.join]);
    if (sig !== lastSig) { lastSig = sig; render(s); }
    const t = document.getElementById("timer");
    if (t) t.textContent = Math.ceil(s.left);
    const a = document.getElementById("answered");
    if (a) a.textContent = `Ответили: ${s.answered} из ${s.players.length}`;
  } catch {
    $main.innerHTML = `<h2 class="error">Нет связи с сервером. Проверь, что он запущен.</h2>`;
    $actions.innerHTML = ""; lastSig = "";
  }
}

document.addEventListener("click", async (e) => {
  const act = e.target.closest("[data-act]");
  const kick = e.target.closest("[data-kick]");
  if (act) { act.disabled = true; await post(act.dataset.act); lastSig = ""; poll(); }
  if (kick) { await post("kick", { pid: kick.dataset.kick }); poll(); }
});

(async () => {
  const check = await post("check").catch(() => ({ error: "Нет связи с сервером." }));
  if (check.error) {
    $main.innerHTML = `<h2 class="error">${esc(check.error)}</h2>
      <p class="muted">Открой ссылку для ведущего целиком, вместе с <b>?key=…</b>. Её показывает сервер при запуске.</p>`;
    return;
  }
  poll();
  setInterval(poll, 500);
})();
</script>
</body>
</html>
