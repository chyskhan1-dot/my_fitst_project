<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Квиз — ведущий</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen stage for a TV — top bar with progress dots, big centered scene, action button bottom-right */
:root {
  --bg: #0e1330;
  --bg2: #1a1050;
  --panel: rgba(255, 255, 255, .07);
  --panel-solid: #1c2354;
  --ink: #f4f5ff;
  --muted: #a7aedb;
  --line: rgba(255, 255, 255, .12);
  --accent: #ffd23f;
  --accent-ink: #1a1400;
  --a0: #e5484d; --a1: #3e7bfa; --a2: #f2a516; --a3: #26a269;
  --good: #3ddc84; --bad: #ff6b6b;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--body); font-size: clamp(16px, 1.6vw, 22px);
  background: radial-gradient(120% 90% at 10% 0%, var(--bg2) 0%, var(--bg) 60%) fixed, var(--bg);
  padding: 24px 16px; overflow-x: hidden;
}
/* мягкие светящиеся пятна на фоне */
body::before, body::after {
  content: ""; position: fixed; z-index: -1; border-radius: 50%; filter: blur(80px); opacity: .35;
  width: 46vmax; height: 46vmax; pointer-events: none;
}
body::before { background: #3e3bd8; top: -14vmax; right: -12vmax; animation: drift 18s ease-in-out infinite alternate; }
body::after { background: #c2316b; bottom: -18vmax; left: -14vmax; animation: drift 22s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.1); } }

.stage { max-width: 1200px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.row-right { display: flex; align-items: center; gap: 12px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; color: var(--muted); }
.brand { font-family: var(--display); font-weight: 800; color: var(--ink); font-size: 1.05em; display: flex; align-items: center; gap: 10px; }
.brand::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: var(--accent); transform: rotate(45deg); }
.dots { display: flex; gap: 6px; align-items: center; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.done { background: var(--muted); }
.dots i.now { background: var(--accent); width: 26px; border-radius: 6px; }
main { flex: 1; display: flex; flex-direction: column; gap: 28px; justify-content: center; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(30px, 5vw, 64px); font-weight: 800; }
h2 { font-size: clamp(24px, 3.4vw, 46px); font-weight: 500; }
.muted { color: var(--muted); }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .7em; font-weight: 800; color: var(--accent); }

/* появление элементов */
.rise { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.5); } }

/* аватарки */
.ava {
  width: 1.9em; height: 1.9em; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: .85em; color: #fff; background: var(--c);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2);
}

/* лобби */
.join { display: flex; gap: 36px; align-items: center; flex-wrap: wrap; padding: 28px; border-radius: 24px; background: var(--panel); border: 1px solid var(--line); }
.share-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.join-text { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.room-code { font-family: var(--display); font-weight: 800; font-size: clamp(48px, 8vw, 110px); letter-spacing: .12em; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
a.btn { text-decoration: none; display: inline-block; }
.join-url { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 4vw, 52px); color: var(--accent); word-break: break-all; }
#qr { background: #fff; padding: 12px; border-radius: 16px; line-height: 0; }
#qr:empty { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  font: 700 1em var(--body); padding: 6px 16px 6px 6px; border-radius: 999px; display: inline-flex; align-items: center; gap: 10px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); cursor: pointer;
}
.chip:hover { border-color: var(--bad); text-decoration: line-through; }
.waiting::after { content: "…"; display: inline-block; animation: blink 1.2s steps(4) infinite; width: 1.2em; overflow: hidden; vertical-align: bottom; }
@keyframes blink { from { width: 0; } }

/* вопрос */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 28px; }
.ring { position: relative; width: clamp(90px, 10vw, 140px); aspect-ratio: 1; flex: none; max-width: 100%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s linear, stroke .3s; }
.ring.low .bar { stroke: var(--bad); }
.ring span {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: clamp(28px, 3.4vw, 48px); font-variant-numeric: tabular-nums;
}
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.opt {
  display: flex; align-items: center; gap: 16px; padding: 24px 26px; border-radius: 18px;
  font-weight: 800; font-size: 1.2em; color: #fff; min-width: 0; position: relative; overflow: hidden;
  background: var(--c); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .18);
  transition: opacity .5s, transform .5s;
}
.opt .shape { font-size: 1.1em; flex: none; position: relative; }
.opt .label { min-width: 0; flex: 1; position: relative; }
.opt .count { position: relative; font-family: var(--display); font-variant-numeric: tabular-nums; }
.opt .fill { position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); background: rgba(255, 255, 255, .18); transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.opt.dim { opacity: .3; transform: scale(.97); }
.opt.right { outline: 4px solid #fff; outline-offset: 4px; animation: glow 1.2s ease-in-out 2; }
@keyframes glow { 50% { transform: scale(1.03); } }

/* таблица лидеров */
.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 860px; }
.row {
  display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 20px; border-radius: 16px;
  background: var(--panel); border: 1px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums;
  position: relative; overflow: hidden;
  animation: slide 1s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 60ms);
}
@keyframes slide { from { transform: translateY(calc(var(--from, 0) * 74px)); opacity: .4; } }
.row .bar { position: absolute; inset: 0 auto 0 0; width: var(--w); background: linear-gradient(90deg, rgba(255, 210, 63, .14), rgba(255, 210, 63, .03)); animation: grow 1.2s .3s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes grow { from { width: 0; } }
.row > *:not(.bar) { position: relative; }
.row .pos { font-family: var(--display); color: var(--muted); width: 2ch; text-align: center; }
.row:nth-child(1) .pos { color: var(--accent); }
.row:nth-child(1) { border-color: rgba(255, 210, 63, .5); }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .fire { font-size: .85em; color: #ffa24a; }
.row .plus { color: var(--good); font-size: .9em; }
.row .move { width: 3ch; font-size: .85em; text-align: center; }
.move.up { color: var(--good); } .move.down { color: var(--bad); } .move.same { color: var(--muted); }
.row .sc { font-family: var(--display); min-width: 4ch; text-align: right; }
.row.up { animation: slide 1s cubic-bezier(.2, .8, .2, 1) both, flash-up 1.6s 1s ease-out both; animation-delay: calc(var(--i) * 60ms), 1s; }
.row.down { animation: slide 1s cubic-bezier(.2, .8, .2, 1) both, flash-down 1.6s 1s ease-out both; animation-delay: calc(var(--i) * 60ms), 1s; }
@keyframes flash-up { 0% { box-shadow: 0 0 0 3px var(--good), 0 0 28px rgba(61, 220, 132, .55); } 100% { box-shadow: none; } }
@keyframes flash-down { 0% { box-shadow: 0 0 0 3px var(--bad), 0 0 28px rgba(255, 107, 107, .45); } 100% { box-shadow: none; } }
.leaders-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 360px); gap: 24px; align-items: start; }
.comments { display: flex; flex-direction: column; gap: 10px; }
.comment { padding: 12px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-weight: 700; line-height: 1.35;
  animation: rise .5s ease both; animation-delay: calc(1.4s + var(--i) * .7s); }
.comment b { color: var(--accent); }
@media (max-width: 900px) { .leaders-wrap { grid-template-columns: 1fr; } }
/* вопрос-число: кто ближе */
.num-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
.num-list li { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 12px; background: var(--panel); font-weight: 700;
  animation: rise .4s ease both; animation-delay: calc(var(--i) * 120ms); }
.num-list li.best { outline: 2px solid var(--good); background: rgba(61, 220, 132, .12); }
.num-list .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num-list .v { font-family: var(--display); }
.num-list .d { color: var(--muted); min-width: 7ch; text-align: right; font-variant-numeric: tabular-nums; }
/* темы и сложность в меню */
.theme-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.theme-chip { font: 700 .8em var(--body); padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.theme-chip.on { background: rgba(255, 210, 63, .14); border-color: var(--accent); color: var(--ink); }
.theme-chip small { opacity: .7; margin-left: 4px; }
.picker-line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 14px; }

/* финал */
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 14px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(240px, 31%); }
.step .ava { font-size: 1.5em; }
.ava.emo { background: var(--panel); box-shadow: none; font-size: 1.15em; }
.chip.off { opacity: .5; }
.sound { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.sound.blocked { border-color: var(--accent); color: var(--accent); animation: blink2 1.2s ease-in-out infinite; }
@keyframes blink2 { 50% { opacity: .5; } }
.emoji-pic { font-size: clamp(64px, 11vw, 150px); line-height: 1.1; text-align: center; letter-spacing: .08em; }
.melody { display: flex; align-items: center; gap: 18px; justify-content: center; font-size: 1.4em; font-weight: 800; }
.melody .eq { display: flex; gap: 5px; align-items: flex-end; height: 40px; }
.melody .eq i { width: 8px; background: var(--accent); border-radius: 4px; animation: eq 0.9s ease-in-out infinite; }
.melody .eq i:nth-child(2) { animation-delay: .2s; } .melody .eq i:nth-child(3) { animation-delay: .4s; } .melody .eq i:nth-child(4) { animation-delay: .6s; }
@keyframes eq { 0%, 100% { height: 20%; } 50% { height: 100%; } }
.step .nm { font-weight: 800; text-align: center; overflow-wrap: anywhere; }
.step .block {
  width: 100%; border-radius: 16px 16px 0 0; background: var(--panel-solid); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; padding-top: 16px;
  font-family: var(--display); font-weight: 800; font-size: 1.6em; transform-origin: bottom;
  animation: up .9s cubic-bezier(.2, .8, .2, 1) both;
}
.step .block small { font-family: var(--body); color: var(--muted); font-weight: 700; font-size: .55em; margin-top: 6px; }
.step.p1 .block { height: 220px; background: var(--accent); color: var(--accent-ink); border: 0; animation-delay: .9s; }
.step.p1 .block small { color: var(--accent-ink); }
.step.p2 .block { height: 160px; animation-delay: .5s; }
.step.p3 .block { height: 115px; animation-delay: .1s; }
.step.p1 > :not(.block) { animation: rise .5s 1.5s both; }
@keyframes up { from { transform: scaleY(0); } }
#confetti { position: fixed; inset: 0; pointer-events: none; width: 100%; height: 100%; }

/* картинка и аудио в вопросе */
.qmedia { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.qimg { max-width: 100%; max-height: 36vh; border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35); background: #fff; }
.qimg.small { max-height: 18vh; }
/* эффект картинки: размыта и проясняется / виден кусочек и отдаляется */
.fx { display: inline-block; overflow: hidden; border-radius: 16px; line-height: 0; }
.fx .qimg { box-shadow: none; }
.fx-blur .qimg { animation: unblur var(--t) linear var(--d) both; }
.fx-zoom .qimg { transform-origin: var(--fx); animation: unzoom var(--t) linear var(--d) both; }
@keyframes unblur { from { filter: blur(32px); } to { filter: blur(4px); } }
@keyframes unzoom { from { transform: scale(5); } to { transform: scale(1.5); } }

.qaudio { display: flex; align-items: center; gap: 10px; font-size: 1.4em; }
.qaudio audio { max-width: min(480px, 80vw); }
.auto-next { align-self: center; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 8px; }
.auto-next .ava { font-size: .8em; }
.mode.pack { padding: 12px 18px; }
.pack-tools { display: flex; gap: 10px; flex-wrap: wrap; }
.btn.small { padding: 10px 16px; font-size: .8em; cursor: pointer; }

/* интерактивные вопросы */
.qhint { margin: 0; font-size: 1.3em; font-weight: 800; color: var(--accent); text-align: center; }
.order-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.order-list li { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; font-size: 1.15em; }
.order-list .num { font-family: var(--display); color: var(--accent-ink); background: var(--accent); width: 1.8em; height: 1.8em; border-radius: 50%; display: grid; place-items: center; flex: none; }
.text-answer { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 5vw, 64px); color: var(--good); }
.chip.said { cursor: default; padding: 8px 14px; font-size: .85em; }
.chip.said.ok { border-color: var(--good); }
.chip.said.no { color: var(--muted); }
.chip.said:hover { text-decoration: none; }

/* «Своя игра» */
.si-layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 24px; align-items: start; }
.si-board { display: grid; grid-template-columns: minmax(120px, 1.6fr) repeat(var(--cols), minmax(0, 1fr)); gap: 8px; }
.si-theme { display: flex; align-items: center; padding: 10px 14px; border-radius: 12px; background: var(--panel); font-weight: 800; font-size: .9em; min-width: 0; overflow-wrap: anywhere; }
.si-cell { font: 800 1.3em var(--display); color: var(--accent); background: #1d2a8a; border: 0; border-radius: 12px; padding: 14px 4px; cursor: pointer;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25); transition: transform .1s, background .15s; }
.si-cell:hover { background: #2a3bb0; transform: translateY(-2px); }
.si-cell.played { background: transparent; border: 1px dashed var(--line); box-shadow: none; cursor: default; }
.si-scores { display: flex; flex-direction: column; gap: 8px; }
.si-score { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-weight: 700; }
.si-score .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.si-score b { font-family: var(--display); font-variant-numeric: tabular-nums; }
.si-score b.neg { color: var(--bad); }
.si-score.hl { border-color: var(--accent); background: rgba(255, 210, 63, .12); }
.si-score.off { opacity: .5; }
.si-q { display: flex; flex-direction: column; gap: 16px; }
.si-text { font-size: clamp(24px, 3.2vw, 44px); white-space: pre-line; }
.si-text-small { margin: 0; white-space: pre-line; }
.si-timer { font-weight: 800; color: var(--accent); font-size: 1.2em; margin: 0; min-height: 1.4em; }
.si-who { font-size: 1.4em; margin: 0; display: flex; align-items: center; gap: 10px; }
.si-splash { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.si-splash .lead { font-size: 1.4em; margin: 0; }
.si-verdicts { display: flex; flex-direction: column; gap: 8px; }
.si-verdict { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.si-verdict.ok { border-color: var(--good); }
.si-verdict .d { font-family: var(--display); margin-left: auto; }
.si-verdict.ok .d { color: var(--good); } .si-verdict.no .d { color: var(--bad); }
@media (max-width: 900px) { .si-layout { grid-template-columns: 1fr; } }
/* «100 к 1» */
.fd-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.fd-teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; }
.fd-team { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: var(--panel); border: 2px solid transparent; }
.fd-team.r { flex-direction: row-reverse; text-align: right; }
.fd-team.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
.fd-team .nm { flex: 1; font-weight: 800; }
.fd-team b { font: 800 1.6em var(--display); color: var(--c); font-variant-numeric: tabular-nums; }
.fd-bank { text-align: center; font: 800 1.8em var(--display); color: var(--accent); }
.fd-bank small { display: block; font: 700 .45em var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.fd-board { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(var(--rows), auto); gap: 10px; }
.fd-slot { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 14px; font: inherit; color: var(--ink); text-align: left;
  background: #1d2a8a; border: 0; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25); min-height: 64px; }
button.fd-slot { cursor: pointer; }
button.fd-slot:hover { background: #2a3bb0; }
.fd-slot .n { font: 800 1.2em var(--display); width: 1.6em; height: 1.6em; display: grid; place-items: center; border-radius: 50%; background: rgba(255, 255, 255, .12); flex: none; }
.fd-slot .t { flex: 1; font-weight: 800; font-size: 1.15em; text-transform: uppercase; overflow-wrap: anywhere; }
.fd-slot .p { font: 800 1.3em var(--display); color: var(--accent); }
.fd-slot.open { background: linear-gradient(180deg, #ffd23f, #f2a516); color: var(--accent-ink); animation: flip .5s ease both; }
.fd-slot.open .p { color: var(--accent-ink); }
.fd-slot.missed { background: rgba(255, 255, 255, .08); color: var(--muted); }
.fd-slot.missed .p { color: var(--muted); }
#fd-timer.low, #si-round-time.low { color: var(--bad); }
.fd-status .tdot, .si-splash .tdot, .eyebrow .tdot { width: .8em; height: .8em; border-radius: 50%; display: inline-block; vertical-align: baseline; box-shadow: none; }
.fd-team .tdot { width: 1.2em; height: 1.2em; }
@keyframes flip { from { transform: rotateX(90deg); } to { transform: none; } }
.fd-strikes { display: flex; gap: 10px; align-items: center; min-height: 56px; }
.fd-x { font: 800 44px var(--display); color: var(--line); line-height: 1; }
.fd-x.on { color: var(--bad); animation: pop .3s ease both; }
.fd-status { font-size: 1.3em; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fd-log { display: flex; gap: 8px; flex-wrap: wrap; }
.fd-big { display: grid; gap: 10px; }
.fd-big-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 12px; background: var(--panel); }
.fd-big-row .p { font: 800 1.2em var(--display); color: var(--accent); }
.fd-big-row small { color: var(--muted); }
.fd-target { height: 16px; border-radius: 99px; background: var(--panel); overflow: hidden; }
.fd-target i { display: block; height: 100%; width: var(--w); background: linear-gradient(90deg, var(--accent), var(--good)); transition: width .8s; }
@media (max-width: 900px) { .fd-board { grid-template-columns: 1fr; grid-auto-flow: row; } .fd-teams { grid-template-columns: 1fr 1fr; } .fd-bank { grid-column: 1 / -1; order: -1; } .fd-big-row { grid-template-columns: 1fr auto; } }

/* главное меню v2 */
.mode-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.mode-row .mode { padding: 14px 16px; }
.pack-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.pack-grid .mode { padding: 12px 16px; }
.pack-tools { margin-top: 10px; }
.rules-line { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.modal-back { position: fixed; inset: 0; background: rgba(5, 8, 25, .7); z-index: 20; }
.modal { position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100vw - 32px));
  max-height: calc(100vh - 48px); overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 24px; padding: 22px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .5); display: flex; flex-direction: column; gap: 16px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal-head h2 { font-size: 1.4em; }
@media (max-width: 760px) { .mode-row { grid-template-columns: 1fr; } }

/* главное меню */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 32px; align-items: start; }
.section-title { font-family: var(--display); font-weight: 700; font-size: .95em; margin: 0 0 14px; }
.modes { display: flex; flex-direction: column; gap: 12px; }
.mode {
  display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 18px; text-align: left;
  background: var(--panel); border: 2px solid var(--line); color: var(--ink); font: inherit; cursor: pointer;
}
.mode .ico { font-size: 1.8em; width: 1.6em; text-align: center; flex: none; }
.mode b { display: block; font-family: var(--display); font-weight: 700; }
.mode small { color: var(--muted); }
.mode.on { border-color: var(--accent); background: rgba(255, 210, 63, .08); }
.mode:disabled { cursor: default; opacity: .55; }
.badge { margin-left: auto; flex: none; font-size: .7em; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--line); color: var(--muted); }
.mode.on .badge { background: var(--accent); color: var(--accent-ink); }
.rules { display: flex; flex-direction: column; gap: 8px; }
.rule {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line); cursor: pointer;
}
.rule input { position: absolute; opacity: 0; pointer-events: none; }
.rule .txt { flex: 1; min-width: 0; }
.rule.wrap { flex-wrap: wrap; }
.rule.wrap .txt { flex: 1 1 260px; }
.rule .txt b { display: block; font-size: .95em; }
.rule .txt small { color: var(--muted); font-size: .78em; }
.switch { width: 48px; height: 28px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
.rule input:checked + .switch { background: var(--good); }
.rule input:checked + .switch::after { transform: translateX(20px); }
.rule input:focus-visible + .switch { outline: 3px solid var(--ink); outline-offset: 2px; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--line); flex: none; }
.seg button { font: 800 .85em var(--body); padding: 6px 12px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--bg); }
.seg button:disabled { opacity: .35; cursor: default; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: .75em; font-weight: 800; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.teams-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.team-col { padding: 14px; border-radius: 16px; background: var(--panel); border-top: 4px solid var(--c); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.team-col h3 { margin: 0; font-family: var(--display); font-size: .9em; color: var(--c); }
.team-col .chips { gap: 6px; }
.tdot { width: 1.9em; height: 1.9em; border-radius: 10px; flex: none; background: var(--c); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2); }
.row .minus { color: var(--bad); font-size: .9em; }
.mvp { color: var(--muted); text-align: center; }
.mvp b { color: var(--ink); }
@media (max-width: 900px) { .setup { grid-template-columns: 1fr; } }

.actions { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
.btn {
  font: 800 1.05em var(--body); padding: 16px 30px; border-radius: 16px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px rgba(255, 210, 63, .25), inset 0 -4px 0 rgba(0, 0, 0, .15);
  transition: transform .15s;
}
.btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); box-shadow: none; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.error { color: var(--bad); }

@media (max-width: 640px) {
  .options { grid-template-columns: 1fr; }
  .qhead { flex-direction: column-reverse; align-items: flex-start; gap: 12px; }
  .row .plus, .row .fire { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .fx-blur .qimg { filter: blur(14px); } /* без анимации картинка всё равно скрыта */
  .fx-zoom .qimg { transform: scale(3); }
}
</style>
</head>
<body>
<canvas id="confetti" hidden></canvas>
<!-- поля выбора файлов вне меню: меню перерисовывается, а выбранный файл не должен теряться -->
<input type="file" id="pack-file" accept=".json,.csv,.txt,.xlsx" hidden>
<input type="file" id="siq-file" accept=".siq" hidden>
<input type="file" id="fd-file" accept=".json,.csv,.txt" hidden>
<div class="stage">
  <div class="top">
    <span class="brand" id="brand">Квиз</span>
    <span class="row-right"><span id="progress"></span> <button class="sound" id="sound" type="button" aria-label="Звук">🔊</button></span>
  </div>
  <main id="main"><h2 class="muted waiting">Подключаюсь к серверу</h2></main>
  <div class="actions" id="actions"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/static/pack.js"></script>
<script src="/static/music.js"></script>
<script src="/static/comments.js"></script>
<script>
const SHAPES = ["▲", "◆", "●", "■"];
const COLORS = ["#e5484d", "#3e7bfa", "#f2a516", "#26a269", "#a855f7", "#ec4899", "#14b8a6", "#f97316"];
const room = new URLSearchParams(location.search).get("room") || "";
const token = (() => { try { return localStorage.getItem("quiz-host-" + room) || ""; } catch { return ""; } })();
const $main = document.getElementById("main");
const $actions = document.getElementById("actions");
const seen = new Set();
let version = null, lastSig = "", draft = null, lastState = null;
const TEAM_COLORS = ["var(--a0)", "var(--a1)", "var(--a2)", "var(--a3)"];
const MODES = [
  { id: "quiz", ico: "❓", name: "Викторина", desc: "Варианты ответов, кто быстрее", ready: true },
  { id: "jeopardy", ico: "🎯", name: "Своя игра", desc: "Табло тем и цен, кнопка «Ответить»", ready: true },
  { id: "100to1", ico: "💯", name: "100 к 1", desc: "Две команды угадывают популярные ответы", ready: true },
];
const RULES = [
  { id: "penalty", name: "Штраф за ошибку", desc: "Неверный ответ отнимает 300 очков (ниже нуля счёт не опускается)" },
  { id: "speed", name: "Бонус за скорость", desc: "Быстрый ответ — до 1000 очков. Если выключить, всегда 1000" },
  { id: "streak", name: "Бонус за серию 🔥", desc: "+100 очков за каждый правильный ответ подряд, до +500" },
  { id: "leaders", name: "Таблица лидеров после вопроса", desc: "Показывать места после каждого раунда" },
  { id: "auto", name: "Автопереход", desc: "Все ответили — сразу ответ, через 4 с лидеры, через 5 с следующий вопрос. Нажимать ничего не нужно" },
];
const teamDot = (t) => `<span class="tdot" style="--c:${TEAM_COLORS[t]}"></span>`;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function color(name) { let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const ava = (name, cls = "") => `<span class="ava ${cls}" style="--c:${color(name)}">${esc([...name][0].toUpperCase())}</span>`;
// аватарка игрока: выбранный значок или первая буква имени
const avaP = (p) => (p.avatar ? `<span class="ava emo">${esc(p.avatar)}</span>` : ava(p.name));

// копирование: navigator.clipboard работает только по https, дома по Wi-Fi (http) — запасной способ
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const t = document.createElement("textarea");
  t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch {}
  t.remove();
  return ok;
}

async function post(action, extra = {}) {
  const r = await fetch("/api/host/" + action, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ room, token, ...extra }),
  });
  return r.json();
}

function dots(s) {
  return `<span class="dots" aria-label="Вопрос ${s.index + 1} из ${s.total}">${Array.from({ length: s.total }, (_, i) =>
    `<i class="${i < s.index ? "done" : i === s.index ? "now" : ""}"></i>`).join("")}</span>`;
}

function media(s) {
  const emoji = s.emoji ? `<div class="emoji-pic rise" aria-label="Картинка из эмодзи">${esc(s.emoji)}</div>` : "";
  if (s.melody) return emoji + `<div class="melody rise"><span class="eq"><i></i><i></i><i></i><i></i></span> Слушай мелодию
    <button class="btn ghost small" data-replay type="button">▶ Ещё раз</button></div>`;
  if (!s.image && !s.audio) return emoji;
  return emoji + `<div class="qmedia rise">
    ${s.image ? fxImg(s, "Картинка к вопросу") : ""}
    ${s.audio ? `<div class="qaudio">🎵 <audio controls preload="auto" src="${esc(QuizPack.mediaSrc(s.audio))}"></audio></div>` : ""}
  </div>`;
}

const fmtNum = (n) => Number(n).toLocaleString("ru-RU");
// картинка с эффектом: анимация длится всё время вопроса (с учётом уже прошедшего)
function fxImg(s, alt) {
  const img = `<img class="qimg" src="${esc(QuizPack.mediaSrc(s.image))}" alt="${alt}">`;
  if (!s.image_fx) return img;
  const [x, y] = s.focus || [50, 50];
  return `<div class="fx fx-${s.image_fx}" style="--t:${s.seconds}s;--d:-${Math.max(0, s.seconds - s.left).toFixed(1)}s;--fx:${x}% ${y}%">${img}</div>`;
}

const HINTS = {
  number: "🔢 Напиши число на телефоне — побеждает тот, кто ближе",
  multi: "☑️ Выбери на телефоне все верные варианты",
  order: "🔢 Расставь на телефоне по порядку",
  text: "✍️ Напиши ответ на телефоне",
};

function questionBody(s) {
  const hint = HINTS[s.qtype] ? `<p class="qhint rise">${HINTS[s.qtype]}</p>` : "";
  if (s.qtype === "text") return hint;
  if (s.qtype === "number") return hint + (s.unit ? `<p class="muted rise">Ответ — в единицах: <b style="color:var(--ink)">${esc(s.unit)}</b></p>` : "");
  return hint + options(s, false);
}

function revealBody(s) {
  if (s.qtype === "number") {
    const unit = s.unit ? " " + esc(s.unit) : "";
    return `<div class="text-answer rise">${fmtNum(s.correct_number)}${unit}</div>
      ${s.number_answers.length ? `<ol class="num-list">${s.number_answers.map((a, i) => `
        <li class="${a.best ? "best" : ""}" style="--i:${i}"><span class="pos">${i + 1}</span>${avaP(a)}<span class="nm">${esc(a.name)}${a.best ? " 🎯" : ""}</span>
          <span class="v">${fmtNum(a.value)}</span><span class="d">${a.diff === 0 ? "в точку!" : (a.diff > 0 ? "+" : "−") + fmtNum(Math.abs(a.diff))}</span></li>`).join("")}</ol>`
        : `<p class="muted">Никто не ответил</p>`}`;
  }
  if (s.qtype === "order") {
    return `<ol class="order-list">${s.correct_order.map((o, i) => `<li class="rise" style="--i:${i}"><span class="num">${i + 1}</span>${esc(o)}</li>`).join("")}</ol>`;
  }
  if (s.qtype === "text") {
    return `<div class="text-answer rise">${esc(s.correct_text)}</div>
      ${s.text_answers.length ? `<div class="chips">${s.text_answers.map((a) =>
        `<span class="chip said ${a.ok ? "ok" : "no"}">${a.ok ? "✓" : "✗"} ${esc(a.name)}: «${esc(a.text)}»</span>`).join("")}</div>` : ""}`;
  }
  return options(s, true);
}

function options(s, reveal) {
  const total = reveal ? Math.max(1, s.counts.reduce((a, b) => a + b, 0)) : 1;
  return `<div class="options">${s.options.map((o, i) => {
    const right = Array.isArray(s.correct) ? s.correct.includes(i) : i === s.correct;
    const cls = reveal ? (right ? "right" : "dim") : "rise";
    const fill = reveal ? `<span class="fill" style="--w:0%" data-w="${(s.counts[i] / total) * 100}%"></span>` : "";
    const count = reveal ? `<span class="count">${s.counts[i]}</span>` : "";
    return `<div class="opt ${cls}" style="--c:var(--a${i});--i:${i + 1}">${fill}<span class="shape">${SHAPES[i]}</span><span class="label">${esc(o)}</span>${count}</div>`;
  }).join("")}</div>`;
}

function board(players) {
  const max = Math.max(1, ...players.map((p) => p.score));
  if (!players.length) return "";
  return `<ol class="board">${players.map((p, i) => {
    const place = i + 1, from = p.prev ? p.prev - place : 0;
    const move = !p.prev ? "" : from > 0 ? `<span class="move up">↑${from}</span>` : from < 0 ? `<span class="move down">↓${-from}</span>` : `<span class="move same">—</span>`;
    return `<li class="row ${from > 0 ? "up" : from < 0 ? "down" : ""}" style="--i:${i};--from:${from};--w:${(p.score / max) * 100}%">
      <span class="bar"></span><span class="pos">${place}</span>${p.team != null && p.id == null ? teamDot(p.team) : avaP(p)}
      <span class="nm">${esc(p.name)}</span>
      ${p.streak >= 2 ? `<span class="fire">🔥 ${p.streak}</span>` : ""}
      ${p.last > 0 ? `<span class="plus">+${p.last}</span>` : p.last < 0 ? `<span class="minus">−${-p.last}</span>` : ""}
      ${move}<span class="sc" data-count="${p.score}">${p.score - p.last}</span></li>`;
  }).join("")}</ol>`;
}

function countUp() {
  document.querySelectorAll("[data-count]").forEach((el) => {
    const from = Number(el.textContent), to = Number(el.dataset.count), t0 = performance.now();
    if (from === to) return;
    const step = (t) => {
      const k = Math.min(1, (t - t0 - 500) / 900);
      el.textContent = Math.round(from + (to - from) * Math.max(0, 1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

let musicKey = "";
// у каждой мелодии свой инструмент: указанный в пакете или по очереди
const instrumentFor = (s) => s.instrument || QuizMusic.MELODY_INSTRUMENTS[s.index % QuizMusic.MELODY_INSTRUMENTS.length];
function soundtrack(s) {
  const key = s.phase + ":" + s.index;
  if (key === musicKey) return;
  musicKey = key;
  const M = window.QuizMusic;
  if (!M) return;
  if (s.phase === "setup" || s.phase === "lobby") M.play("lobby");
  else if (s.phase === "question") {
    if (s.audio || s.melody) M.stop(0.3); else M.play("question");
    if (s.melody) setTimeout(() => M.melody(s.melody, s.tempo, instrumentFor(s)), 600);
    else M.sting("start");
  } else if (s.phase === "reveal") { M.stopMelody(); M.stop(0.3); M.sting("reveal"); }
  else if (s.phase === "leaders") M.play("leaders");
  else if (s.phase === "final") { M.stop(0.3); M.sting("fanfare"); setTimeout(() => { if (musicKey.startsWith("final")) M.play("final"); }, 2600); }
}

function soundButton() {
  const b = document.getElementById("sound"), M = window.QuizMusic;
  if (!b || !M) return;
  const blocked = M.blocked && !M.muted;
  b.textContent = M.muted ? "🔇 Звук выкл" : blocked ? "🔈 Включить звук" : "🔊";
  b.classList.toggle("blocked", blocked);
}

function render(s) {
  document.getElementById("brand").textContent = `${s.title} · комната ${s.room}`;
  document.title = s.title + " — ведущий";
  const prog = document.getElementById("progress");
  prog.innerHTML = s.index >= 0 && s.phase !== "final" ? dots(s) : `Игроков: ${s.players.length}`;
  confetti(false);
  if (s.phase.startsWith("si_")) return renderSi(s);
  if (s.phase.startsWith("fd_")) return renderFd(s);
  soundtrack(s);

  if (s.phase === "setup") {
    if (!draft) draft = { ...s.settings };
    renderSetup(s);
  } else if (s.phase === "lobby") {
    draft = null;
    const url = (s.join || location.origin) + "/?room=" + s.room;
    const st = s.settings;
    const fdMode = st.mode === "100to1";
    const tags = fdMode ? [`💯 100 к 1`, `Пакет: ${s.title}`, "2 команды", `${st.seconds} с на ответ`, st.auto ? "Автопереход" : "Ведущий листает сам"]
      : st.mode === "jeopardy" ? [`🎯 Своя игра`, `Пакет: ${s.title}`, ...rulesSummary(st)] : [
      `Пакет: ${s.title}`,
      st.teams ? `Команды: ${st.teams}` : "Каждый за себя",
      st.count ? `${s.total} случайных вопросов` : `Вопросов: ${s.total}`,
      ...(st.level && st.level !== "any" ? [LEVELS.find((l) => l[0] === st.level)[1]] : []),
      ...(st.themes && st.themes.length ? [`Темы: ${st.themes.join(", ")}`] : []),
      `${st.seconds} сек на ответ`,
      ...RULES.filter((r) => st[r.id]).map((r) => r.name.replace(" 🔥", "")),
    ];
    const chip = (p) => `<button class="chip ${seen.has(p.id) ? "" : "pop"} ${p.online ? "" : "off"}" data-kick="${esc(p.id)}" title="${p.online ? "" : "Не на связи"}">${avaP(p)}${esc(p.name)}${p.online ? "" : " · нет связи"}</button>`;
    const people = st.teams
      ? `<div class="teams-grid">${s.teams.slice().sort((a, b) => a.team - b.team).map((t) => `
          <div class="team-col" style="--c:${TEAM_COLORS[t.team]}"><h3>${esc(t.name)} · ${t.size}</h3>
          <div class="chips">${s.players.filter((p) => p.team === t.team).map(chip).join("")}</div></div>`).join("")}</div>`
      : `<div class="chips">${s.players.map(chip).join("")}</div>`;
    $main.innerHTML = `
      <div><div class="eyebrow">Квиз начинается</div><h1>Заходите в игру!</h1></div>
      <div class="join rise">
        <div id="qr"></div>
        <div class="join-text">
          <span class="muted">Наведи камеру на QR-код или открой на телефоне</span>
          <span class="join-url">${esc((s.join || location.origin).replace(/^https?:\/\//, ""))}</span>
          <span class="muted">и введи код комнаты</span>
          <span class="room-code">${s.room}</span>
          <div class="share-row">
            <button class="btn ghost small" data-copy="${esc(url)}" type="button">📋 Копировать ссылку</button>
            ${navigator.share ? `<button class="btn ghost small" data-share="${esc(url)}" type="button">📤 Поделиться</button>` : ""}
            <a class="btn ghost small" href="/?room=${s.room}" target="_blank" rel="noopener">📱 Играть с этого устройства</a>
          </div>
        </div>
      </div>
      <div>
        <p class="muted ${s.players.length ? "" : "waiting"}">${s.players.length ? `В игре ${s.players.length} (нажми на имя, чтобы убрать):` : "Ждём игроков"}</p>
        ${people}
      </div>
      <div class="tags">${tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>`;
    s.players.forEach((p) => seen.add(p.id));
    if (window.QRCode) new QRCode(document.getElementById("qr"), { text: url, width: 180, height: 180 });
    $actions.innerHTML = `<button class="btn ghost" data-act="setup">← Правила</button>
      <button class="btn" data-act="next" ${s.players.length ? "" : "disabled"}>Начать игру</button>`;
  } else if (s.phase === "question") {
    $main.innerHTML = `
      <div class="qhead">
        <div><div class="eyebrow">Вопрос ${s.index + 1}${s.theme ? " · " + esc(s.theme) : ""}</div><h2 class="rise">${esc(s.question)}</h2></div>
        <div class="ring" id="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44"/><circle class="bar" cx="50" cy="50" r="44" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><span id="timer">${Math.ceil(s.left)}</span></div>
      </div>
      ${media(s)}
      ${questionBody(s)}
      <p class="muted" id="answered"></p>`;
    const audio = document.querySelector(".qaudio audio");
    if (audio) audio.play().catch(() => {}); // если браузер не дал включить звук сам — есть кнопка ▶
    $actions.innerHTML = `<button class="btn ghost" data-act="next">Показать ответ</button>`;
  } else if (s.phase === "reveal") {
    const last = s.index + 1 >= s.total;
    const partial = s.partial_count ? `, частично: <b style="color:var(--ink)">${s.partial_count}</b>` : "";
    $main.innerHTML = `
      <div><div class="eyebrow">Правильный ответ</div><h2>${esc(s.question)}</h2></div>
      ${s.image ? `<div class="qmedia"><img class="qimg small" src="${esc(QuizPack.mediaSrc(s.image))}" alt=""></div>` : ""}
      ${revealBody(s)}
      <p class="muted rise">Правильно ответили: <b style="color:var(--ink)">${s.right_count} из ${s.players.length}</b>${partial}</p>`;
    requestAnimationFrame(() => requestAnimationFrame(() =>
      document.querySelectorAll(".fill").forEach((f) => f.style.setProperty("--w", f.dataset.w))));
    const label = last ? "Итоги игры" : s.settings.leaders ? "Таблица лидеров" : "Следующий вопрос";
    $actions.innerHTML = `<button class="btn" data-act="next">${label}</button>`;
  } else if (s.phase === "leaders") {
    $main.innerHTML = `
      <div><div class="eyebrow">После вопроса ${s.index + 1} из ${s.total}</div><h1>Таблица лидеров</h1></div>
      <div class="leaders-wrap"><div>${s.settings.teams ? board(s.teams) + `<p class="muted" style="margin:12px 0 10px">Лучшие игроки</p>` + board(s.players.slice(0, 3)) : board(s.players)}</div>
        <aside class="comments">${QuizComments.comments(s).map((c, i) => `<div class="comment" style="--i:${i}">${c}</div>`).join("")}</aside></div>`;
    countUp();
    $actions.innerHTML = `<button class="btn" data-act="next">Следующий вопрос</button>`;
  } else if (s.phase === "final") {
    const teamMode = !!s.settings.teams;
    const [p1, p2, p3] = teamMode ? s.teams : s.players;
    const step = (p, n) => p ? `<div class="step p${n}">${teamMode ? teamDot(p.team) : avaP(p)}<span class="nm">${esc(p.name)}</span><div class="block">${n}<small>${p.score} очков</small></div></div>` : "";
    const mvp = s.players[0];
    $main.innerHTML = `
      <div style="text-align:center"><div class="eyebrow">Игра окончена</div><h1>${teamMode ? "Победила команда" : "Победители"}</h1></div>
      <div class="podium">${step(p2, 2)}${step(p1, 1)}${step(p3, 3)}</div>
      ${teamMode && mvp ? `<p class="mvp rise">Лучший игрок: <b>${esc(mvp.name)}</b> · ${mvp.score} очков</p>` : ""}`;
    $actions.innerHTML = `<button class="btn ghost" data-act="setup">Изменить правила</button>
      <button class="btn ghost" data-share-site type="button">📤 Поделиться сайтом</button>
      <button class="btn" data-act="reset">Сыграть ещё раз</button>`;
    setTimeout(() => confetti(true), 1500);
  } else {
    location.reload(); // незнакомый этап: значит, страница устарела
  }
}

// ---------- «Своя игра» ----------
const plural = (n, one, few, many) => (n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many);
const SPECIAL_NAMES = { cat: "🐱 Кот в мешке", auction: "🔨 Аукцион", norisk: "🤝 Вопрос без риска" };
let siMusicKey = "";

function siScores(s, highlight) {
  return `<aside class="si-scores">${s.players.map((p) => `
    <div class="si-score ${highlight && highlight.id === p.id ? "hl" : ""} ${p.online ? "" : "off"}">${avaP(p)}<span class="nm">${esc(p.name)}</span>
      <b class="${p.score < 0 ? "neg" : ""}">${p.score}</b></div>`).join("")}</aside>`;
}

function siMedia(c) {
  const parts = [];
  if (c.image) parts.push(`<img class="qimg" src="${esc(QuizPack.mediaSrc(c.image))}" alt="Картинка к вопросу">`);
  if (c.video) parts.push(`<video class="qimg" src="${esc(c.video)}" controls autoplay playsinline></video>`);
  if (c.audio) parts.push(`<div class="qaudio">🎵 <audio controls autoplay src="${esc(QuizPack.mediaSrc(c.audio))}"></audio></div>`);
  if (c.melody) parts.push(`<div class="melody"><span class="eq"><i></i><i></i><i></i><i></i></span> Слушай мелодию</div>`);
  if (c.melody || c.audio || c.video) parts.push(`<button class="btn ghost small" data-si-replay type="button">▶ Ещё раз</button>`);
  return parts.length ? `<div class="qmedia si-media">${parts.join("")}</div>` : "";
}

function siSound(s) {
  const si = s.si, c = si.cur || {};
  const key = s.phase + ":" + si.round_index + ":" + (c.theme || "") + c.price;
  if (key === siMusicKey || !window.QuizMusic) return;
  siMusicKey = key;
  const M = QuizMusic;
  if (s.phase === "si_round") { M.stop(0.3); M.sting("start"); }
  else if (s.phase === "si_board") M.play("lobby");
  else if (s.phase === "si_question") {
    if (c.melody || c.audio || c.video) { M.stop(0.3); if (c.melody) setTimeout(() => M.melody(c.melody, c.tempo, c.instrument || "piano"), 500); }
    else M.play("question");
  } else if (s.phase === "si_reveal") { M.stopMelody(); M.stop(0.3); M.sting("reveal"); }
  else if (s.phase === "si_final_bet") M.play("question");
  else if (s.phase === "si_final_reveal") { M.stop(0.3); M.sting("reveal"); }
}

function renderSi(s) {
  const si = s.si, c = si.cur || {}, f = si.final || {};
  siSound(s);
  document.getElementById("progress").innerHTML = si.round_name && !s.phase.startsWith("si_final")
    ? `${esc(si.round_name)} · ${si.round_index + 1} из ${si.rounds_total} <span id="si-round-time"></span>` : "Финал";
  const head = c.theme ? `<div class="eyebrow">${esc(c.theme)} · ${c.stake}${c.special !== "simple" ? " · " + SPECIAL_NAMES[c.special] : ""}</div>` : "";
  let body = "", actions = "";
  if (s.phase === "si_round") {
    body = `<div class="si-splash">${si.burned ? `<p class="lead">⏱ Раунд окончен: ${si.burned} ${plural(si.burned, "вопрос сгорел", "вопроса сгорели", "вопросов сгорели")}</p>` : ""}
      <div class="eyebrow">Своя игра</div><h1>${esc(si.round_name)}</h1>
      <p class="muted">${(si.board || []).map((t) => esc(t.name)).join(" · ")}</p></div>`;
    actions = `<button class="btn" data-act="next">Дальше</button>`;
  } else if (s.phase === "si_board") {
    body = `<div class="si-layout"><div class="si-board" style="--cols:${Math.max(...si.board.map((t) => t.cells.length))}">${si.board.map((t, ti) => `
        <div class="si-theme">${esc(t.name)}</div>${t.cells.map((cell, qi) => cell.played
          ? `<div class="si-cell played"></div>`
          : `<button class="si-cell" data-si-pick="${ti},${qi}">${cell.price}</button>`).join("")}`).join("")}</div>
      ${siScores(s, si.chooser)}</div>`;
    actions = `<span class="auto-next">Выбирает ${si.chooser ? avaP(si.chooser) + " " + esc(si.chooser.name) : "…"} — на телефоне или кликни клетку</span>
      <button class="btn ghost" data-act="next">Завершить раунд</button>`;
  } else if (s.phase === "si_cat_give") {
    body = `<div class="si-splash"><h1>🐱 Кот в мешке!</h1><p class="lead">${esc(si.chooser.name)} отдаёт вопрос сопернику</p>
      <p class="muted">Тема: <b>${esc(c.theme)}</b> · стоимость ${c.stake}</p></div>${siScores(s, si.chooser)}`;
    actions = `<button class="btn ghost" data-act="next">Решить за игрока</button>`;
  } else if (s.phase === "si_stake") {
    body = `<div class="si-splash"><h1>🔨 Аукцион</h1><p class="lead">${esc(si.chooser.name)} делает ставку</p>
      <p class="muted">Тема: <b>${esc(c.theme)}</b> · от ${c.price} до ${c.max_stake}</p></div>${siScores(s, si.chooser)}`;
    actions = `<button class="btn ghost" data-act="next">Ставка по номиналу</button>`;
  } else if (s.phase === "si_question" || s.phase === "si_answer") {
    const who = c.answerer ? `<p class="si-who">✋ Отвечает ${avaP(c.answerer)} <b>${esc(c.answerer.name)}</b></p>` : "";
    body = `<div class="si-layout"><div class="si-q">${head}<h2 class="si-text">${esc(c.text || "")}</h2>${siMedia(c)}
      ${who}<p class="si-timer" id="si-timer"></p></div>${siScores(s, c.answerer)}</div>`;
    actions = s.phase === "si_question" && !c.exclusive && !c.buzz_open ? `<button class="btn ghost" data-act="next">Открыть кнопки</button>`
      : s.phase === "si_answer" ? `<button class="btn ghost" data-act="next">Время вышло</button>` : "";
  } else if (s.phase === "si_reveal") {
    const v = si.verdicts || [];
    body = `<div class="si-layout"><div class="si-q">${head}<p class="muted si-text-small">${esc(c.text || "")}</p>
        <div class="text-answer">${esc(c.answer)}</div>
        ${c.answer_image ? `<img class="qimg small" src="${esc(c.answer_image)}" alt="">` : ""}
        ${c.note ? `<p class="muted">${esc(c.note)}</p>` : ""}
        <div class="si-verdicts">${v.length ? v.map((x, i) => `
          <div class="si-verdict ${x.ok ? "ok" : "no"}">${avaP(x.player)} <b>${esc(x.player.name)}</b>: «${esc(x.text || "—")}»
            <span class="d">${x.delta > 0 ? "+" : ""}${x.delta}</span>
            <button class="btn ghost small" data-si-ovr="${i}" type="button">${x.ok ? "✗ Не засчитывать" : "✓ Засчитать"}</button></div>`).join("")
          : `<p class="muted">Никто не ответил</p>`}</div></div>${siScores(s, null)}</div>`;
    actions = `<button class="btn" data-act="next">Дальше</button>`;
  } else if (s.phase === "si_final_bet") {
    body = `<div class="si-splash"><div class="eyebrow">Финал</div><h1>Тема: ${esc(f.theme)}</h1>
      <p class="lead">Участники делают ставки на телефонах</p>
      <div class="chips">${f.eligible.map((p) => `<span class="chip said ${f.bets_done.includes(p.id) ? "ok" : ""}">${avaP(p)} ${esc(p.name)} ${f.bets_done.includes(p.id) ? "✓" : "…"}</span>`).join("")}</div></div>`;
    actions = `<button class="btn ghost" data-act="next">Хватит ждать</button>`;
  } else if (s.phase === "si_final_q") {
    body = `<div class="si-q"><div class="eyebrow">Финал · ${esc(f.theme)}</div><h2 class="si-text">${esc(f.text || "")}</h2>${siMedia(f)}
      <div class="chips">${f.eligible.map((p) => `<span class="chip said ${f.answered.includes(p.id) ? "ok" : ""}">${avaP(p)} ${esc(p.name)} ${f.answered.includes(p.id) ? "✓" : "…"}</span>`).join("")}</div>
      <p class="si-timer" id="si-timer"></p></div>`;
    actions = `<button class="btn ghost" data-act="next">Открыть ответы</button>`;
  } else if (s.phase === "si_final_reveal") {
    body = `<div class="si-layout"><div class="si-q"><div class="eyebrow">Финал · ${esc(f.theme)}</div><div class="text-answer">${esc(f.answer)}</div>
      <div class="si-verdicts">${(si.verdicts || []).map((x, i) => `
        <div class="si-verdict ${x.ok ? "ok" : "no"}">${avaP(x.player)} <b>${esc(x.player.name)}</b>: «${esc(x.text || "—")}» · ставка ${x.bet}
          <span class="d">${x.delta > 0 ? "+" : ""}${x.delta}</span>
          <button class="btn ghost small" data-si-ovr="${i}" type="button">${x.ok ? "✗ Не засчитывать" : "✓ Засчитать"}</button></div>`).join("")}</div></div>
      ${siScores(s, null)}</div>`;
    actions = `<button class="btn" data-act="next">Итоги игры</button>`;
  }
  $main.innerHTML = body;
  $actions.innerHTML = actions;
  live(s);
}

// ---------- «100 к 1» ----------
let fdSeen = null;
function fdSound(s) {
  const fd = s.fd, c = fd.cur || {}, M = window.QuizMusic;
  const now = { phase: s.phase, r: fd.round_index, strikes: c.strikes || 0, opened: (c.slots || []).filter((x) => x.opened).length,
    big: fd.big ? fd.big.i : -1 };
  const was = fdSeen || {};
  fdSeen = now;
  if (!M) return;
  const newPhase = now.phase !== was.phase || now.r !== was.r || now.big !== was.big;
  if (s.phase === "fd_round" && newPhase) { M.stop(0.3); M.sting("start"); }
  else if (s.phase === "fd_play" || s.phase === "fd_steal") {
    if (newPhase && was.phase !== "fd_play") M.play("question");
    if (now.strikes > (was.strikes || 0) && was.r === now.r) M.sting("wrong");
    else if (now.opened > (was.opened || 0) && was.r === now.r) M.sting("reveal");
  } else if (s.phase === "fd_reveal" && newPhase) {
    M.stop(0.3);
    const last = (c.log || []).slice(-1)[0];
    M.sting(last && last.result === "wrong" ? "wrong" : "reveal");
    setTimeout(() => { if (fdSeen.phase === "fd_reveal") M.play("leaders"); }, 1200);
  } else if (s.phase === "fd_reveal" && now.opened > was.opened) M.sting("reveal");
  else if (s.phase === "fd_big_intro" && newPhase) { M.stop(0.3); M.sting("fanfare"); }
  else if (s.phase === "fd_big_q" && newPhase) { if (was.phase !== "fd_big_q") M.play("question"); else M.sting(fd.big.answers.slice(-1)[0]?.points ? "reveal" : "wrong"); }
  else if (s.phase === "fd_big_result" && newPhase) { M.stop(0.3); M.sting(fd.big.total >= fd.big.target ? "fanfare" : "reveal"); }
}

function fdTeams(s, active, bank) {
  const fd = s.fd, names = s.team_names;
  const members = (t) => s.players.filter((p) => p.team === t);
  const team = (t, side) => `<div class="fd-team ${side} ${active === t ? "on" : ""}" style="--c:${TEAM_COLORS[t]}">
    ${teamDot(t)}<span class="nm">${esc(names[t])}<small class="muted" style="display:block;font-weight:600;font-size:.75em">${members(t).map((p) => esc(p.name)).join(", ") || "нет игроков"}</small></span>
    <b>${fd.team_scores[t]}</b></div>`;
  return `<div class="fd-teams">${team(0, "")}<div class="fd-bank">${bank == null ? "" : `<small>Банк</small>${bank}`}</div>${team(1, "r")}</div>`;
}

function renderFd(s) {
  const fd = s.fd, c = fd.cur || {}, b = fd.big, names = s.team_names;
  fdSound(s);
  const prog = document.getElementById("progress");
  prog.innerHTML = c.name ? `${esc(c.name)} · ${fd.round_index + 1} из ${fd.rounds_total}` : "Большая игра";
  let body = "", actions = "";
  if (s.phase === "fd_round") {
    body = `<div class="si-splash"><div class="eyebrow">Раунд ${fd.round_index + 1} из ${fd.rounds_total}</div><h1>${esc(c.name)}</h1>
      <p class="lead">${c.reverse ? "Нужно назвать <b>самый редкий</b> ответ: чем ниже в списке, тем дороже"
        : c.mult > 1 ? `Все очки × ${c.mult}` : "Угадайте самые популярные ответы"}</p>
      <p class="muted">Начинают: ${teamDot(c.team)} <b style="color:var(--ink)">${esc(names[c.team])}</b></p></div>
      ${fdTeams(s, c.team, null)}`;
    actions = `<button class="btn" data-act="next">Начать</button>`;
  } else if (["fd_play", "fd_steal", "fd_reveal"].includes(s.phase)) {
    const reveal = s.phase === "fd_reveal", steal = s.phase === "fd_steal";
    const rows = Math.ceil(c.slots.length / 2);
    const slots = c.slots.map((x, i) => x.opened
      ? `<div class="fd-slot open" style="--i:${i}"><span class="n">${x.n}</span><span class="t">${esc(x.text)}</span><span class="p">${x.points}</span></div>`
      : reveal
        ? `<button class="fd-slot missed" data-fd-open="${i}" title="Засчитать этот ответ команде-победителю"><span class="n">${x.n}</span><span class="t">${esc(x.text)}</span><span class="p">${x.points}</span></button>`
        : `<button class="fd-slot" data-fd-open="${i}" title="Открыть вручную, если ответ назвали, а проверка не узнала"><span class="n">${x.n}</span><span class="t"></span></button>`).join("");
    const strikes = `<div class="fd-strikes" aria-label="Промахов: ${c.strikes} из 3">${[0, 1, 2].map((k) => `<span class="fd-x ${k < c.strikes ? "on" : ""}">✗</span>`).join("")}</div>`;
    const other = 1 - c.team;
    const status = reveal
      ? `<p class="fd-status">🏆 ${c.bank} очков забирают ${teamDot(c.winner)} <b>${esc(names[c.winner])}</b>${c.steal ? (c.winner === other ? " — банк украден!" : " — кража не удалась") : ""}</p>`
      : steal
        ? `<p class="fd-status">⚡ ${teamDot(other)} <b>${esc(names[other])}</b> могут забрать банк: одна попытка, отвечает любой · <span id="fd-timer"></span></p>`
        : `<p class="fd-status">🎤 Отвечает ${c.guesser ? `${avaP(c.guesser)} <b>${esc(c.guesser.name)}</b>` : "…"} · ${teamDot(c.team)} ${esc(names[c.team])} · <span id="fd-timer"></span></p>`;
    const log = c.log.length ? `<div class="fd-log">${c.log.map((x) => `<span class="chip said ${x.result === "right" ? "ok" : "no"}">${x.result === "right" ? "✓" : x.result === "already" ? "↺" : "✗"} ${esc(x.name)}: «${esc(x.text || "время вышло")}»${x.result === "already" ? " — уже открыт" : ""}</span>`).join("")}</div>` : "";
    body = `<div class="fd-head"><div><div class="eyebrow">${esc(c.name)}${c.mult > 1 ? " · очки × " + c.mult : ""}</div>
        <h2 class="rise">${esc(c.q)}</h2></div>${strikes}</div>
      ${fdTeams(s, steal ? other : reveal ? c.winner : c.team, c.bank)}
      <div class="fd-board" style="--rows:${rows}">${slots}</div>
      ${status}${log}
      ${reveal && fd.note && fd.round_index === 0 ? `<p class="muted" style="margin:0;font-size:.8em">${esc(fd.note)}</p>` : ""}`;
    const last = fd.round_index + 1 >= fd.rounds_total;
    actions = reveal ? `<button class="btn" data-act="next">${last ? (fd.has_big ? "Большая игра" : "Итоги игры") : "Следующий раунд"}</button>`
      : (s.phase === "fd_play" && c.strikes ? `<button class="btn ghost" data-act="fd_unstrike">Отменить промах</button>` : "")
        + `<button class="btn ghost" data-act="next">${steal ? "Не угадали" : "Время вышло"}</button>`;
  } else if (s.phase === "fd_big_intro") {
    body = `<div class="si-splash"><div class="eyebrow">Финал</div><h1>Большая игра</h1>
      <p class="lead">Играют ${teamDot(b.team)} <b>${esc(names[b.team])}</b></p>
      <p class="muted">${b.count} вопросов, по 25 секунд. Отвечает любой из команды — один ответ на вопрос.<br>
        Цель — набрать ${b.target} очков: по очкам самых популярных ответов</p></div>
      ${fdTeams(s, b.team, null)}`;
    actions = `<button class="btn" data-act="next">Начать</button>`;
  } else if (s.phase === "fd_big_q") {
    body = `<div class="fd-head"><div><div class="eyebrow">Большая игра · вопрос ${b.i + 1} из ${b.count} · ${teamDot(b.team)} ${esc(names[b.team])}</div>
        <h2 class="rise">${esc(b.q)}</h2></div><div class="fd-bank"><small>Осталось</small><span id="fd-timer"></span></div></div>
      ${fdBig(b)}
      <p class="muted" style="margin:0">Отвечайте на телефоне — подойдёт первый ответ любого игрока команды</p>`;
    actions = `<button class="btn ghost" data-act="next">Пропустить вопрос</button>`;
  } else if (s.phase === "fd_big_result") {
    const won = b.total >= b.target;
    body = `<div class="si-splash"><div class="eyebrow">Большая игра</div><h1>${won ? "Победа! 🎉" : "Почти получилось"}</h1>
      <p class="lead">${teamDot(b.team)} ${esc(names[b.team])}: <b>${b.total}</b> из ${b.target}</p></div>
      ${fdBig(b, true)}`;
    actions = `<button class="btn" data-act="next">Итоги игры</button>`;
    if (won) setTimeout(() => confetti(true), 600);
  }
  $main.innerHTML = body;
  $actions.innerHTML = actions;
  live(s);
}

function fdBig(b, result) {
  const rows = b.answers.map((a, i) => `<div class="fd-big-row rise" style="--i:${i}">
      <span>${esc(a.q)}${result && b.tops ? `<br><small>Топ: ${b.tops[i].answers.map((x) => `${esc(x.text)} ${x.points}`).join(" · ")}</small>` : ""}</span>
      <span>${a.text ? `«${esc(a.text)}»` : `<span class="muted">нет ответа</span>`}${a.match && a.match.toLowerCase() !== a.text.toLowerCase() ? ` <small>= ${esc(a.match)}</small>` : ""}</span>
      <span class="p">${a.points}</span></div>`).join("");
  return `<div class="fd-big">${rows}
    <div class="fd-big-row"><b>Итого</b><div class="fd-target"><i style="--w:${Math.min(100, (b.total / b.target) * 100)}%"></i></div><span class="p">${b.total} / ${b.target}</span></div></div>`;
}

let rulesOpen = false;

function packCards(s, d) {

    return `<div class="pack-grid">${list.map((p) => `
      <button class="mode pack ${d.fd_pack === p.id ? "on" : ""}" data-fdpack="${esc(p.id)}"><span><b>${esc(p.title)}</b><small>${esc(p.sub)}</small></span></button>`).join("")}</div>

        <span class="muted" style="font-size:.8em">Таблица: Вопрос; Ответ 1; Очки 1; Ответ 2; Очки 2… Другие написания — через «/»</span></div>

  }

    ? s.si_packs.map((p) => ({ id: p.id, title: p.title, sub: `${p.rounds} раунд. · ${p.count} вопр.${p.final ? " · финал" : ""}` }))
    : s.packs.map((p) => ({ id: p.id, title: p.title, sub: `${p.count} вопросов` }));

// Темы и сложность: какие вопросы пакета играть
const LEVELS = [["any", "Любая"], ["easy", "Лёгкие"], ["normal", "Средние"], ["hard", "Сложные"]];
const packMeta = (s, d) => ((d.pack === "custom" ? s.custom : s.packs.find((p) => p.id === d.pack)) || {}).meta || [];
function themePicker(s, d) {
  const meta = packMeta(s, d);
  const themes = [...new Set(meta.map((m) => m[0]).filter(Boolean))];
  const chosen = new Set(d.themes && d.themes.length ? d.themes : themes);
  const fits = meta.filter((m) => (!themes.length || chosen.has(m[0])) && (d.level === "any" || m[1] === d.level)).length;
  const levels = new Set(meta.map((m) => m[1]).filter(Boolean));
  return `${themes.length > 1 ? `<div class="theme-chips">${themes.map((t) => `<button type="button" class="theme-chip ${chosen.has(t) ? "on" : ""}" data-theme-toggle="${esc(t)}">${esc(t)}<small>${meta.filter((m) => m[0] === t).length}</small></button>`).join("")}
      <button type="button" class="theme-chip" data-themes-all>${chosen.size === themes.length ? "Снять все" : "Все темы"}</button></div>` : ""}
    <div class="picker-line">${levels.size ? `<span class="muted">Сложность</span><span class="seg">${LEVELS.map(([v, n]) => `<button type="button" class="${d.level === v ? "on" : ""}" data-level="${v}">${n}</button>`).join("")}</span>` : ""}

function rulesSummary(d) {

    ...(d.level && d.level !== "any" ? [LEVELS.find((l) => l[0] === d.level)[1]] : []), ...(d.themes && d.themes.length ? [`Тем: ${d.themes.length}`] : []),

       <div class="rule"><span class="txt"><b>Время на ответ</b><small>Сколько секунд у игрока после нажатия «Ответить»</small></span>${seg("seconds", [10, 20, 30], d.seconds, (v) => v + " с")}</div>
       ${toggle({ id: "auto", name: "Автопереход", desc: "Через 6 секунд после ответа — снова табло" })}`
    : `<div class="rule wrap"><span class="txt"><b>Командная игра</b><small>Счёт команды — средний по игрокам</small></span>${seg("teams", [0, 2, 3, 4], d.teams, (v) => (v ? v + " команды" : "Выкл"))}</div>

       <div class="rule"><span class="txt"><b>Время на ответ</b><small>На «несколько верных» и «по порядку» — в 1,5 раза больше, на свой ответ и число — в 1,25</small></span>${seg("seconds", [10, 20, 30], d.seconds, (v) => v + " с")}</div>

document.addEventListener("click", (e) => {
  if (!draft) return;
  if (e.target.closest("[data-open-rules]")) { rulesOpen = true; return renderSetup(lastState); }
  if (e.target.closest("[data-close-rules]")) { rulesOpen = false; return renderSetup(lastState); }
  const tt = e.target.closest("[data-theme-toggle], [data-themes-all]");
  if (tt) {
    const all = [...new Set(packMeta(lastState, draft).map((m) => m[0]).filter(Boolean))];
    const cur = new Set(draft.themes && draft.themes.length ? draft.themes : all);
    if (tt.dataset.themesAll != null) draft.themes = cur.size === all.length ? [all[0]] : [];
    else {
      const name = tt.dataset.themeToggle;
      cur.has(name) ? cur.delete(name) : cur.add(name);
      draft.themes = !cur.size ? [name] : cur.size === all.length ? [] : all.filter((x) => cur.has(x)); // хотя бы одна тема
    }
    return renderSetup(lastState);
  }
  const t = e.target.closest("[data-teams], [data-seconds], [data-mode], [data-pack], [data-sipack], [data-fdpack], [data-count], [data-siround], [data-level]");

  e.preventDefault();
  if (t.dataset.sipack) draft.si_pack = t.dataset.sipack;
  if (t.dataset.fdpack) draft.fd_pack = t.dataset.fdpack;
  if (t.dataset.teams) draft.teams = Number(t.dataset.teams);
  if (t.dataset.seconds) draft.seconds = Number(t.dataset.seconds);
  if (t.dataset.mode) draft.mode = t.dataset.mode;
  if (t.dataset.pack && t.dataset.pack !== draft.pack) { draft.pack = t.dataset.pack; draft.themes = []; draft.level = "any"; }
  if (t.dataset.level) draft.level = t.dataset.level;

});

function live(s) {
  const rt = document.getElementById("si-round-time"), rl = s.si && s.si.round_left;
  if (rt) {
    rt.textContent = rl != null ? `· ⏱ ${Math.floor(rl / 60)}:${String(rl % 60).padStart(2, "0")}` : "";
    rt.classList.toggle("low", rl != null && rl < 60);
  }
  const st = document.getElementById("si-timer");
  if (st && s.si) {
    const c = s.si.cur || {}, f = s.si.final || {};
    if (s.phase === "si_question" && !c.exclusive) st.textContent = c.buzz_open ? `Жмите «Ответить»! · ${Math.ceil(c.left)} с` : `Читаем… кнопки откроются через ${Math.ceil(c.buzz_in)} с`;
    else if (s.phase === "si_question") st.textContent = `Готовится отвечать · ${Math.ceil(c.buzz_in)} с`;
    else if (s.phase === "si_answer") st.textContent = `Осталось ${Math.ceil(c.left)} с`;
    else if (s.phase === "si_final_q") st.textContent = `Осталось ${Math.ceil(f.left)} с`;
  }
  const ft = document.getElementById("fd-timer"), fl = s.fd && (s.fd.cur || s.fd.big || {}).left;
  if (ft && fl != null) { ft.textContent = `${Math.ceil(fl)} с`; ft.classList.toggle("low", fl <= 5); }
  if (window.QuizMusic) QuizMusic.setTension((s.phase === "question" && s.left <= 5) || (s.phase === "fd_big_q" && fl <= 5));
  soundButton();
  const nx = document.getElementById("auto-next");
  if (s.auto_left != null) {
    if (!nx) $actions.insertAdjacentHTML("afterbegin", `<span class="auto-next" id="auto-next"></span>`);
    document.getElementById("auto-next").textContent = `Дальше через ${Math.ceil(s.auto_left)} с`;
  } else if (nx) nx.remove();
  const t = document.getElementById("timer");
  if (t) {
    t.textContent = Math.ceil(s.left);
    const ring = document.getElementById("ring");
    ring.querySelector(".bar").setAttribute("stroke-dashoffset", 100 - (s.left / s.seconds) * 100);
    ring.classList.toggle("low", s.left <= 5);
  }
  const a = document.getElementById("answered");
  if (a) a.textContent = `Ответили ${s.answered} из ${s.players.filter((p) => p.online).length}`;
}

// Опрос сервера: следующий запрос — только когда пришёл ответ на прошлый (на медленной сети
// запросы иначе копятся и ответы приходят вперемешку), зависший запрос обрывается через 5 с.
let polling = false, pollAgain = false, fails = 0;
async function poll() {
  if (polling) { pollAgain = true; return; }
  polling = true;
  try { await pollOnce(); } finally {
    polling = false;
    if (pollAgain) { pollAgain = false; poll(); }
  }
}
const pollTick = () => { if (!polling) poll(); };
const timeout = (ms) => (window.AbortSignal && AbortSignal.timeout ? AbortSignal.timeout(ms) : undefined);

async function pollOnce() {
  try {
    const s = await (await fetch("/api/state?room=" + encodeURIComponent(room), { cache: "no-store", signal: timeout(5000) })).json();
    fails = 0;
    if (s.phase === "gone") return stop("Эта комната закрылась", "Комнаты без активности удаляются через 3 часа, а при обновлении сервера — сразу.");
    if (version && s.version !== version) return location.reload(); // сервер обновился
    version = s.version;
    lastState = s;
    const siKey = s.si ? JSON.stringify(s.si, (k, v) => (k === "left" || k === "buzz_in" || k === "round_left" ? undefined : v)) : "";
    const fdKey = s.fd ? JSON.stringify(s.fd, (k, v) => (k === "left" ? undefined : v)) : "";
    const sig = JSON.stringify([s.phase, s.index, s.players, s.join]) + siKey + fdKey;
    if (sig !== lastSig) { lastSig = sig; render(s); }
    live(s);
  } catch {
    if (++fails < 3) return; // одна-две неудачи подряд — не пугаем, ждём следующего ответа
    $main.innerHTML = `<h2 class="error">Нет связи с сервером. Проверь, что он запущен.</h2>`;
    $actions.innerHTML = ""; lastSig = "";
  }
}

/* конфетти для финала */
let confettiRun = 0;
function confetti(on) {
  const cv = document.getElementById("confetti");
  confettiRun++;
  if (!on || matchMedia("(prefers-reduced-motion: reduce)").matches) { cv.hidden = true; return; }
  const run = confettiRun, ctx = cv.getContext("2d");
  cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
  const bits = Array.from({ length: 180 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .6,
    vx: (Math.random() - .5) * 2.4, vy: 2 + Math.random() * 3.5, r: Math.random() * Math.PI,
    vr: (Math.random() - .5) * .3, s: 6 + Math.random() * 8, c: COLORS[Math.floor(Math.random() * COLORS.length)],
  }));
  const t0 = performance.now();
  (function frame(t) {
    if (run !== confettiRun) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.r += b.vr; b.vy += .02;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c;
      ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore();
    }
    if (t - t0 < 7000) requestAnimationFrame(frame); else cv.hidden = true;
  })(t0);
}

document.addEventListener("click", async (e) => {
  if (window.QuizMusic) QuizMusic.unlock(); // браузер разрешает звук только после нажатия
  if (e.target.closest("#sound")) { QuizMusic.toggle(); soundButton(); return; }

  const cp = e.target.closest("[data-copy]");
  if (cp) { const ok = await copyText(cp.dataset.copy); cp.textContent = ok ? "✓ Ссылка скопирована" : "Не получилось — скопируй адрес вручную"; return; }
  const ss = e.target.closest("[data-share-site]");

  }
  const act = e.target.closest("[data-act]");
  const kick = e.target.closest("[data-kick]");
  try {
    if (act) { act.disabled = true; await post(act.dataset.act, act.dataset.act === "configure" ? { settings: draft } : {}); }
    if (kick) await post("kick", { pid: kick.dataset.kick });
  } catch {
    // связь пропала: кнопка снова станет активной после перерисовки
  } finally {
    lastSig = ""; poll();
  }
});

let timer = null;
function stop(title, text) {
  clearInterval(timer);
  $main.innerHTML = `<h2 class="error">${esc(title)}</h2><p class="muted">${esc(text)}</p>`;
  $actions.innerHTML = `<a class="btn" href="/">Создать новую игру</a>`;
}

(async () => {
  const check = await post("check").catch(() => ({ error: "Нет связи с сервером." }));
  if (check.error) return stop(check.error, "Создай свою игру на главной странице: нажми «Я ведущий».");
  poll();
  timer = setInterval(pollTick, 500);
})();
</script>
</body>
