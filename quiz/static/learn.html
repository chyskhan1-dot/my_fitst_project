<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1330">
<title>Квиз — тренировка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Тренировка для одного: свой темп, сразу правильный ответ, ошибки возвращаются, пока не выучишь */
:root {
  --bg: #0e1330; --bg2: #1a1050; --panel: rgba(255, 255, 255, .08); --ink: #f4f5ff; --muted: #a7aedb;
  --line: rgba(255, 255, 255, .12); --accent: #ffd23f; --accent-ink: #1a1400;
  --a0: #e5484d; --a1: #3e7bfa; --a2: #f2a516; --a3: #26a269; --good: #3ddc84; --bad: #ff6b6b; --mood: transparent;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif; --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--ink); font: 17px var(--body);
  background: radial-gradient(90% 60% at 50% 100%, var(--mood), transparent 70%) fixed,
              radial-gradient(120% 80% at 0% 0%, var(--bg2), var(--bg) 65%) fixed, var(--bg);
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); transition: background .5s;
}
body[data-mood="good"] { --mood: rgba(61, 220, 132, .3); }
body[data-mood="bad"] { --mood: rgba(255, 107, 107, .28); }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: center; gap: 10px; font-weight: 800; }
.top a { color: var(--muted); text-decoration: none; }
.top .grow { flex: 1; }
h1, h2 { font-family: var(--display); margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 28px; } h2 { font-size: 20px; font-weight: 500; }
p { margin: 0; line-height: 1.5; }
.muted { color: var(--muted); }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 800; color: var(--accent); }
.btn { font: 800 18px var(--body); padding: 16px; border-radius: 16px; border: 0; cursor: pointer; background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15); }
.btn.ghost { background: var(--panel); color: var(--ink); }
.btn:disabled { opacity: .5; }
.btn:focus-visible, .ans:focus-visible, .chip:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1; }
.section { display: flex; flex-direction: column; gap: 10px; }
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pack { text-align: left; padding: 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; cursor: pointer; }
.pack b { display: block; } .pack small { color: var(--muted); }
.pack.on { border-color: var(--accent); background: rgba(255, 210, 63, .12); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 700 14px var(--body); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.chip.on { background: rgba(255, 210, 63, .14); border-color: var(--accent); color: var(--ink); }
.chip small { opacity: .75; margin-left: 4px; }
.meter { height: 4px; border-radius: 99px; background: var(--line); margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); width: var(--w); }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: var(--w); transition: width .4s; }
.qimg { display: block; max-width: 100%; max-height: 30vh; margin: 0 auto; border-radius: 12px; background: #fff; }
.emoji-pic { font-size: 54px; text-align: center; }
.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ans { position: relative; border: 0; border-radius: 18px; color: #fff; cursor: pointer; padding: 14px; background: var(--c); min-height: 90px;
  font: 800 16px var(--body); overflow-wrap: anywhere; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .2); }
.ans.sel { outline: 4px solid var(--ink); outline-offset: -4px; }
.ans.right { outline: 4px solid var(--good); outline-offset: 2px; }
.ans.wrong { opacity: .45; }
.ans .num[hidden] { display: none; }
.ans.picked { outline: 4px solid var(--bad); outline-offset: 2px; opacity: 1; }
.ans .num { position: absolute; top: 6px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); font: 800 14px var(--display); display: grid; place-items: center; }
input.answer { font: 700 22px var(--body); padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-align: center; width: 100%; }
.verdict { padding: 16px; border-radius: 16px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; animation: rise .35s ease both; }
.verdict.ok { border: 2px solid var(--good); } .verdict.no { border: 2px solid var(--bad); }
.verdict b.big { font-family: var(--display); font-size: 24px; }
.good { color: var(--good); } .bad { color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats div { background: var(--panel); border-radius: 14px; padding: 12px 6px; }
.stats b { display: block; font: 800 26px var(--display); }
.stats span { color: var(--muted); font-size: 13px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.seg { display: inline-flex; background: var(--panel); border-radius: 12px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { font: 700 14px var(--body); border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 9px; cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--bg); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="top"><a href="/">← На главную</a><span class="grow"></span><span id="counter" class="muted"></span></div>
  <main id="main" class="section"><p class="muted">Загружаю…</p></main>
</div>
<script src="/static/pack.js"></script>
<script src="/static/music.js"></script>
<script>
const SHAPES = ["▲", "◆", "●", "■"];
const LEVELS = [["any", "Любая"], ["easy", "Лёгкие"], ["normal", "Средние"], ["hard", "Сложные"]];
const $main = document.getElementById("main"), $counter = document.getElementById("counter");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n).toLocaleString("ru-RU");
const mood = (m) => { document.body.dataset.mood = m || ""; };

// Прогресс хранится только на этом устройстве: для каждого вопроса — «коробка» 0…3 (3 — выучен)
const STORE = "quiz-learn";
const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } };
const save = (d) => { try { localStorage.setItem(STORE, JSON.stringify(d)); } catch {} };
let progress = load();
const qkey = (q) => (q.q || "") + "|" + (q.image || q.emoji || q.melody || "") + "|" + JSON.stringify(q.options || q.answer);
const box = (packId, q) => ((progress[packId] || {})[qkey(q)] || 0);
const setBox = (packId, q, v) => { (progress[packId] = progress[packId] || {})[qkey(q)] = v; save(progress); };

let packs = [], cur = { pack: null, data: null, themes: [], level: "any", count: 10 };
let session = null;

async function start() {
  try { packs = await (await fetch("/api/packs")).json(); }
  catch { $main.innerHTML = `<p class="bad">Нет связи с сервером</p>`; return; }
  try { Object.assign(cur, JSON.parse(localStorage.getItem("quiz-learn-choice")) || {}); } catch {}
  if (!packs.some((p) => p.id === cur.pack)) cur.pack = (packs.find((p) => p.id === "general") || packs[0]).id;
  await choosePack(cur.pack, true);
}

async function choosePack(id, keepThemes) {
  cur.pack = id;
  cur.data = await (await fetch("/api/packs/" + encodeURIComponent(id))).json();
  if (!keepThemes) cur.themes = [];
  menu();
}

const themesOf = (data) => [...new Set(data.questions.map((q) => q.theme || "Без темы"))];
function fits(q) {
  return (!cur.themes.length || cur.themes.includes(q.theme || "Без темы")) && (cur.level === "any" || q.level === cur.level);
}

function menu() {
  mood(""); $counter.textContent = "";
  try { localStorage.setItem("quiz-learn-choice", JSON.stringify({ pack: cur.pack, themes: cur.themes, level: cur.level, count: cur.count })); } catch {}
  const qs = cur.data.questions, themes = themesOf(cur.data);
  const learned = (list) => list.filter((q) => box(cur.pack, q) >= 3).length;
  const pool = qs.filter(fits);
  $main.innerHTML = `
    <div><div class="eyebrow">Тренировка</div><h1>Учи в своём темпе</h1>
      <p class="muted">Отвечай без спешки — сразу увидишь правильный ответ. Ошибки вернутся через пару вопросов, пока не запомнишь.</p></div>
    <div class="section"><b>Пакет</b><div class="packs">${packs.map((p) => `
      <button class="pack ${p.id === cur.pack ? "on" : ""}" data-pack="${esc(p.id)}"><b>${esc(p.title)}</b><small>${p.count} вопросов</small></button>`).join("")}</div></div>
    <div class="section"><b>Темы</b> <span class="muted">${cur.themes.length ? "выбрано: " + cur.themes.length : "все темы"} · зелёная полоска — сколько уже выучено</span>
      <div class="chips">${themes.map((t) => { const list = qs.filter((q) => (q.theme || "Без темы") === t); return `
        <button class="chip ${cur.themes.includes(t) ? "on" : ""}" data-theme="${esc(t)}">${esc(t)}<small>${learned(list)}/${list.length}</small>
          <div class="meter"><i style="--w:${(learned(list) / list.length) * 100}%"></i></div></button>`; }).join("")}
        ${cur.themes.length ? `<button class="chip" data-theme-all>Все темы</button>` : ""}</div></div>
    <div class="section"><b>Сложность</b><span class="seg">${LEVELS.map(([v, n]) => `<button class="${cur.level === v ? "on" : ""}" data-level="${v}">${n}</button>`).join("")}</span></div>
    <div class="section"><b>Сколько вопросов</b><span class="seg">${[10, 20, 50, 0].map((v) => `<button class="${cur.count === v ? "on" : ""}" data-count="${v}">${v || "Все"}</button>`).join("")}</span></div>
    <p class="muted">Подходит вопросов: <b style="color:var(--ink)">${pool.length}</b>, из них выучено ${learned(pool)}. Сначала идут те, что ещё не выучены.</p>
    <button class="btn" id="go" ${pool.length ? "" : "disabled"}>Начать тренировку</button>
    ${learned(qs) ? `<button class="btn ghost" id="reset-progress" type="button">Сбросить прогресс этого пакета</button>` : ""}`;
}

function begin(list) {
  // сначала невыученные, внутри — случайно
  const pool = (list || cur.data.questions.filter(fits)).map((q) => ({ q, b: box(cur.pack, q), r: Math.random() }))
    .sort((a, c) => a.b - c.b || a.r - c.r).map((x) => x.q);
  const take = list ? pool : pool.slice(0, cur.count || pool.length);
  session = { queue: take.slice(), total: take.length, done: new Set(), firstTry: 0, mistakes: new Map(), answered: false, picks: [] };
  next();
}

function next() {
  mood("");
  const s = session;
  if (!s.queue.length) return finish();
  s.q = s.queue[0]; s.answered = false; s.picks = []; s.firstAttempt = !s.mistakes.has(s.q);
  $counter.textContent = `${s.done.size} из ${s.total}`;
  const q = s.q, type = q.type || "choice";
  const media = (q.image ? `<img class="qimg" src="${esc(QuizPack.mediaSrc(q.image))}" alt="Картинка к вопросу">` : "")
    + (q.emoji ? `<div class="emoji-pic">${esc(q.emoji)}</div>` : "")
    + (q.melody ? `<button class="btn ghost" id="play-melody" type="button">▶ Послушать мелодию</button>` : "")
    + (q.audio ? `<audio controls src="${esc(QuizPack.mediaSrc(q.audio))}"></audio>` : "");
  let controls = "";
  if (type === "choice" || type === "multi" || type === "order") {
    const order = q.options.map((_, i) => i);
    if (type === "order") order.sort(() => Math.random() - .5);
    s.order = order;
    controls = `<p class="muted">${type === "multi" ? "Отметь все верные варианты" : type === "order" ? "Нажимай варианты по порядку" : ""}</p>
      <div class="answers">${order.map((i, k) => `<button class="ans" style="--c:var(--a${k})" data-opt="${i}"><span>${SHAPES[k]}</span> ${esc(q.options[i])}<span class="num" hidden></span></button>`).join("")}</div>
      ${type === "choice" ? "" : `<button class="btn" id="submit" disabled>Ответить</button>`}`;
  } else {
    controls = `<form id="text-form" class="section"><input class="answer" id="answer" autocomplete="off" ${type === "number" ? `inputmode="decimal" placeholder="Число${q.unit ? ", " + esc(q.unit) : ""}"` : `placeholder="Твой ответ"`}>
      <button class="btn" type="submit">Ответить</button></form>`;
  }
  $main.innerHTML = `
    <div class="progress"><i style="--w:${(s.done.size / s.total) * 100}%"></i></div>
    <div class="eyebrow">${esc(q.theme || "")}${s.firstAttempt ? "" : " · повтор"}</div>
    <h2>${esc(q.q)}</h2>${media}${controls}<div id="verdict"></div>`;
  const input = document.getElementById("answer");
  if (input) input.focus();
  if (q.melody && window.QuizMusic) setTimeout(() => QuizMusic.melody(q.melody, q.tempo, q.instrument || "piano"), 300);
}

async function judge(value) {
  const s = session, q = s.q, type = q.type || "choice";
  let ok = false, said = "";
  if (type === "choice") ok = value === q.answer;
  else if (type === "multi") ok = JSON.stringify([...value].sort()) === JSON.stringify([...q.answer].sort());
  else if (type === "order") ok = value.every((v, i) => v === i);
  else if (type === "number") {
    const n = Number(String(value).replace(/\s/g, "").replace(",", "."));
    if (!Number.isFinite(n)) return;
    const err = Math.abs(n - q.answer);
    ok = err <= Math.abs(q.answer) * 0.05 && (Number.isInteger(q.answer) && Math.abs(q.answer) < 100 ? err === 0 : true);
    said = `Ты написал ${fmt(n)}${err ? `, ошибка ${fmt(Math.round(err * 100) / 100)}` : ""}`;
  } else {
    const r = await fetch("/api/learn/text", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: value, answers: q.answer }) })
      .then((x) => x.json()).catch(() => ({ ok: false }));
    ok = !!r.ok; said = `Ты написал «${esc(value)}»`;
  }
  s.answered = true;
  s.queue.shift();
  if (ok) {
    s.done.add(q);
    if (s.firstAttempt) s.firstTry++;
    setBox(cur.pack, q, s.firstAttempt ? Math.min(3, box(cur.pack, q) + (box(cur.pack, q) ? 1 : 3)) : 1);
  } else {
    s.mistakes.set(q, (s.mistakes.get(q) || 0) + 1);
    setBox(cur.pack, q, 0);
    s.queue.splice(Math.min(3, s.queue.length), 0, q); // вернётся через пару вопросов
  }
  mood(ok ? "good" : "bad");
  try { navigator.vibrate && navigator.vibrate(ok ? 30 : [60, 40, 60]); } catch {}
  document.querySelectorAll(".ans").forEach((b) => {
    const i = Number(b.dataset.opt);
    b.disabled = true;
    if (type === "choice" && i === value && !ok) b.classList.add("picked"); // что выбрал игрок
    const right = type === "choice" ? i === q.answer : type === "multi" ? q.answer.includes(i) : false;
    if (right) b.classList.add("right"); else if (type !== "order") b.classList.add("wrong");
  });
  document.querySelectorAll("#text-form input, #text-form button, #submit").forEach((x) => (x.disabled = true));
  const answerText = type === "order" ? q.options.map((o, i) => `${i + 1}. ${esc(o)}`).join("<br>") : esc(answerOf(q));
  document.getElementById("verdict").innerHTML = `
    <div class="verdict ${ok ? "ok" : "no"}"><b class="big ${ok ? "good" : "bad"}">${ok ? "Верно!" : "Не совсем"}</b>
      ${said ? `<span class="muted">${said}</span>` : ""}
      ${ok && type === "choice" ? "" : `<span>Правильный ответ: <b>${answerText}</b></span>`}
      ${ok ? "" : `<span class="muted">Этот вопрос вернётся чуть позже</span>`}</div>
    <button class="btn" id="next" style="width:100%;margin-top:10px">Дальше</button>`;
  document.getElementById("next").focus();
}

function answerOf(q) {
  const type = q.type || "choice";
  return type === "choice" ? q.options[q.answer] : type === "multi" ? q.answer.map((i) => q.options[i]).join(", ")
    : type === "order" ? q.options.join(" → ") : type === "number" ? fmt(q.answer) + (q.unit ? " " + q.unit : "") : [].concat(q.answer)[0];
}

function finish() {
  const s = session;
  mood("good"); $counter.textContent = "";
  const wrong = [...s.mistakes.keys()];
  $main.innerHTML = `
    <div><div class="eyebrow">Готово</div><h1>${s.firstTry === s.total ? "Без единой ошибки! 🎉" : "Тренировка пройдена"}</h1></div>
    <div class="stats"><div><b>${s.total}</b><span>вопросов</span></div><div><b class="good">${s.firstTry}</b><span>с первого раза</span></div>
      <div><b class="bad">${wrong.length}</b><span>с ошибками</span></div></div>
    ${wrong.length ? `<div class="section"><b>Где ошибся — запомни</b>${wrong.map((q) => `<p class="muted">• ${q.image && /media\/flags\//.test(q.image)
      ? `<img src="${esc(QuizPack.mediaSrc(q.image))}" alt="" style="height:1.1em;vertical-align:-2px;border-radius:2px"> `
      : esc(q.q.length > 80 ? q.q.slice(0, 80) + "… " : q.q + " ")}→ <b style="color:var(--ink)">${esc(answerOf(q))}</b></p>`).join("")}</div>` : ""}
    <div class="row">${wrong.length ? `<button class="btn" id="again-wrong">Повторить ошибки</button>` : ""}<button class="btn ${wrong.length ? "ghost" : ""}" id="again">Ещё вопросы</button></div>
    <button class="btn ghost" id="to-menu">Выбрать темы</button>`;
  s.wrongList = wrong;
}

document.addEventListener("click", async (e) => {
  const t = e.target;
  if (window.QuizMusic) QuizMusic.unlock();
  const pk = t.closest("[data-pack]");
  if (pk) return choosePack(pk.dataset.pack, false);
  const th = t.closest("[data-theme]");
  if (th) { const n = th.dataset.theme; cur.themes = cur.themes.includes(n) ? cur.themes.filter((x) => x !== n) : [...cur.themes, n]; return menu(); }
  if (t.closest("[data-theme-all]")) { cur.themes = []; return menu(); }
  const lv = t.closest("[data-level]");
  if (lv) { cur.level = lv.dataset.level; return menu(); }
  const ct = t.closest("[data-count]");
  if (ct) { cur.count = Number(ct.dataset.count); return menu(); }
  if (t.closest("#go") || t.closest("#again")) return begin();
  if (t.closest("#again-wrong")) return begin(session.wrongList);
  if (t.closest("#to-menu")) return menu();
  if (t.closest("#reset-progress")) { if (confirm("Сбросить, что выучено в этом пакете?")) { delete progress[cur.pack]; save(progress); menu(); } return; }
  if (t.closest("#next")) return next();
  if (t.closest("#play-melody") && session) { const q = session.q; QuizMusic.melody(q.melody, q.tempo, q.instrument || "piano"); return; }
  const opt = t.closest("[data-opt]");
  if (opt && session && !session.answered) {
    const i = Number(opt.dataset.opt), type = session.q.type || "choice";
    if (type === "choice") return judge(i);
    if (type === "multi") {
      session.picks = session.picks.includes(i) ? session.picks.filter((x) => x !== i) : [...session.picks, i];
      opt.classList.toggle("sel", session.picks.includes(i));
    } else if (!session.picks.includes(i)) {
      session.picks.push(i);
      opt.classList.add("sel");
      const num = opt.querySelector(".num"); num.hidden = false; num.textContent = session.picks.length;
    }
    const submit = document.getElementById("submit");
    submit.disabled = type === "multi" ? !session.picks.length : session.picks.length !== session.q.options.length;
    return;
  }
  if (t.closest("#submit") && session && !session.answered) return judge(session.picks.slice());
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "text-form") return;
  e.preventDefault();
  const v = document.getElementById("answer").value.trim();
  if (v && session && !session.answered) judge(v);
});
start();
</script>
</body>
</html>
