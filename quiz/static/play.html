// Опрос сервера: следующий запрос — только когда пришёл ответ на прошлый (на медленной сети
// запросы иначе копятся и ответы приходят вперемешку), зависший запрос обрывается через 5 с.
// Свернули приложение — телефон рвёт связь, и запрос может так и не вернуться: такой считаем потерянным
// через STALE мс (ответ на него потом выбрасываем), а при возвращении на экран сразу спрашиваем заново.
const STALE = 6000;
let polling = 0, pollAgain = false, fails = 0, pollSeq = 0; // polling — когда ушёл текущий запрос (0 — не ждём)
async function poll() {
  if (polling && Date.now() - polling < STALE) { pollAgain = true; return; }
  const seq = ++pollSeq;
  polling = Date.now();
  try { await pollOnce(seq); } finally {
    if (seq === pollSeq) {
      polling = 0;
      if (pollAgain) { pollAgain = false; poll(); }
    }
  }
}
const pollTick = () => { if (!polling || Date.now() - polling >= STALE) poll(); };
// обрыв запроса по времени; на старых iPhone нет AbortSignal.timeout — обрываем сами
function timeout(ms) {
  if (window.AbortSignal && AbortSignal.timeout) return AbortSignal.timeout(ms);
  if (!window.AbortController) return undefined;
  const c = new AbortController();
  setTimeout(() => c.abort(), ms);
  return c.signal;
}
function wake() {
  if (document.visibilityState !== "visible") return;
  polling = 0; pollSeq++; pollAgain = false;
  poll();
}
document.addEventListener("visibilitychange", wake);
window.addEventListener("pageshow", (e) => { if (e.persisted) wake(); });

async function pollOnce(seq) {
  try {
    if (!room) return;
    const asked = pid; // ответ на запрос, отправленный до входа (или до выхода), уже устарел
    const s = await (await fetch(`/api/state?room=${encodeURIComponent(room)}&pid=${encodeURIComponent(pid || "")}`, { cache: "no-store", signal: timeout(5000) })).json();
    if (seq !== pollSeq) return; // запрос устарел — уже ушёл новый
    fails = 0;
    if (asked !== pid) { pollAgain = true; return; } // иначе только что вошедшего выкинет обратно на форму входа
    if (s.phase === "gone") {
      if (!document.getElementById("gone")) {
        document.getElementById("top").innerHTML = ""; mood("");
        $main.innerHTML = `<div class="scene" id="gone"><h1>Комната закрыта</h1>
          <p class="muted">Ведущий закончил игру или ввёл другой код.</p><button class="btn" id="restart">На главную</button></div>`;
        document.getElementById("restart").onclick = startScreen;
      }
      return;
    }
    lastState = s;
    if (!pid) {
      const hb = document.getElementById("hostbar");
      if (hb) { hb.innerHTML = ""; delete hb.dataset.html; document.body.classList.remove("has-hostbar"); }
      const teams = s.phase === "lobby" ? s.settings.teams : 0;
      if (!document.getElementById("join") || joinTeams !== teams) joinForm();
      return;
    }
    if (version && s.version !== version) return location.reload(); // сервер обновился
    version = s.version;
    const siKey = s.si ? JSON.stringify(s.si, (k, v) => (k === "left" || k === "buzz_in" || k === "blocked" || k === "round_left" ? undefined : v)) : "";
    const fdKey = s.fd ? JSON.stringify(s.fd, (k, v) => (k === "left" ? undefined : v)) : "";
    const hdKey = s.hd ? JSON.stringify(s.hd, (k, v) => (k === "left" || k === "ready_left" ? undefined : v)) : "";
    const topicKey = s.topic ? JSON.stringify(s.topic, (k, v) => (k === "left" || k === "spin_left" || k === "voters" ? undefined : v)) : "";
    const meKey = s.me ? JSON.stringify(s.me, (k, v) => (k === "trick_wait" ? v > 0 : v)) : "";
    const sig = JSON.stringify([s.phase, s.index, s.paused, meKey, s.trick_next, s.trick_now, s.players.length, s.phase === "lobby" && s.teams,
      s.phase === "lobby" && s.players.map((p) => [p.name, p.avatar, p.team, p.online])]) + siKey + fdKey + hdKey + topicKey;
    if (sig !== lastSig) { lastSig = sig; render(s); }
    pauseView(s);
    if (window.QuizMusic && speaker(s)) QuizMusic.setTension(s.phase === "question" && s.left <= 5);
    const tw = document.getElementById("trick-left"); if (tw && s.me) tw.textContent = Math.ceil(s.me.trick_wait || 0);
    const tl = document.getElementById("topic-left"); if (tl && s.topic) tl.textContent = `${Math.ceil(s.topic.left)} с`;
    const tres = document.getElementById("topic-res"); if (tres && s.topic) tres.classList.toggle("shown", s.topic.spin_left <= 0);
    hostBar(s);
  } catch {
    if (seq !== pollSeq) return;
    if (++fails >= 3 && !document.getElementById("join")) {
      $main.innerHTML = `<div class="scene"><div class="spinner"></div><p class="error">Нет связи с сервером…</p></div>`; lastSig = "";
    }
  }
}

let confettiRun = 0;
function confetti(on) {
  const cv = document.getElementById("confetti");
  confettiRun++;
  if (!on || matchMedia("(prefers-reduced-motion: reduce)").matches) { cv.hidden = true; return; }
  const run = confettiRun, ctx = cv.getContext("2d");
  cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
  const bits = Array.from({ length: 90 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5,
    vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, r: Math.random() * Math.PI,
    vr: (Math.random() - .5) * .3, s: 5 + Math.random() * 7, c: COLORS[Math.floor(Math.random() * COLORS.length)],
  }));
  const t0 = performance.now();
  (function frame(t) {
    if (run !== confettiRun) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.r += b.vr; b.vy += .02;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c;
      ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore();
    }
    if (t - t0 < 6000) requestAnimationFrame(frame); else cv.hidden = true;
  })(t0);
}

// На телефоне первое касание кнопки под полем ввода закрывает клавиатуру: экран сдвигается, и нажатие
// приходится мимо кнопки. Поэтому кнопку формы срабатываем уже при касании, пока экран не сдвинулся.
document.addEventListener("pointerdown", (e) => {
  const b = e.target.closest("form button[type=submit]");
  if (!b || b.disabled || e.pointerType === "mouse") return;
  e.preventDefault();
  if (b.form.requestSubmit) b.form.requestSubmit(b); else b.click();
  b.dataset.tapped = Date.now();
});
document.addEventListener("click", (e) => { // обычный «клик» после такого касания — уже лишний
  const b = e.target.closest("form button[type=submit]");
  if (b && Date.now() - (b.dataset.tapped || 0) < 800) { e.preventDefault(); e.stopPropagation(); }
}, true);

document.addEventListener("click", async (e) => {
  const ss = e.target.closest("[data-share-site]");
  if (ss) return shareSite(ss);
  const ib = e.target.closest("[data-install]");
  if (ib) return install(ib);
  const hb = e.target.closest("[data-host]");
  if (hb) {
    hb.disabled = true;
    await api("/api/host/" + hb.dataset.host, { token: hostToken(), on: hb.dataset.on !== "0" }).catch(() => {});
    delete document.getElementById("hostbar").dataset.html; // перерисовать панель (если не получилось — кнопка снова активна)
    lastSig = ""; return poll();
  }
  const sp = e.target.closest("[data-si-cell]");
  if (sp) { const [ti, qi] = sp.dataset.siCell.split(",").map(Number); buzz(20); await siPost("pick", { theme: ti, question: qi }); lastSig = ""; return poll(); }
  const gv = e.target.closest("[data-give]");
  if (gv) { await siPost("give", { to: gv.dataset.give }); lastSig = ""; return poll(); }
  const sk = e.target.closest("[data-stake]");
  if (sk) { await siPost("stake", { amount: Number(sk.dataset.stake) }); lastSig = ""; return poll(); }
  const bt = e.target.closest("[data-bet]");
  if (bt) { await siPost("bet", { amount: Number(bt.dataset.bet) }); lastSig = ""; return poll(); }
  if (e.target.closest("#buzz")) {
    const b = e.target.closest("#buzz");
    b.disabled = true; buzz(40);
    const res = await siPost("buzz");
    if (res.result === "early") {
      document.getElementById("buzz-hint").textContent = "Рано! Кнопка заблокирована на секунду";
      setTimeout(() => { const x = document.getElementById("buzz"); if (x) x.disabled = false; }, 1000);
    } else if (res.result !== "ok") {
      b.disabled = false; lastSig = ""; poll();
    } else { lastSig = ""; poll(); }
    return;
  }
  const av = e.target.closest("[data-ava]");
  if (av) {
    pickAva = av.dataset.ava; remember("quiz-avatar", pickAva);
    document.querySelectorAll("[data-ava]").forEach((x) => x.classList.toggle("on", x === av));
    buzz(10);
    if (pid) {
      document.querySelectorAll("#top .ava, #main .ava.xl").forEach((x) => { x.outerHTML = avaP({ avatar: pickAva }, x.classList.contains("xl") ? "xl" : ""); });
      await api("/api/avatar", { pid, avatar: pickAva }).catch(() => {}); lastSig = ""; poll();
    }
    return;
  }
  const t = e.target.closest("[data-team]");
  if (t) {
    const team = Number(t.dataset.team);
    if (pid) { await api("/api/team", { pid, team }).catch(() => {}); lastSig = ""; poll(); }
    else { pickTeam = team; document.querySelectorAll("[data-team]").forEach((x) => x.classList.toggle("on", x === t)); }
    return;
  }
  if (e.target.closest("#skip")) return send(SKIP);
  if (e.target.closest("[data-listen]") && lastState) { listen(lastState); return; }
  const vote = e.target.closest("[data-vote]");
  if (vote) { buzz(15); document.querySelectorAll("[data-vote]").forEach((b) => b.classList.toggle("on", b === vote)); await api("/api/vote", { pid, theme: vote.dataset.vote }).catch(() => {}); lastSig = ""; poll(); return; }
  const tto = e.target.closest("[data-trick-to]"); // кому подлянка
  if (tto) { trickTo = tto.dataset.trickTo; document.querySelectorAll("[data-trick-to]").forEach((b) => b.classList.toggle("on", b === tto)); buzz(10); return; }
  const trk = e.target.closest("[data-trick]"); // кинуть подлянку — какая, решает сервер
  if (trk) { buzz([20, 40, 20]); trk.disabled = true; await api("/api/trick", { pid, to: trickTo }).catch(() => {}); lastSig = ""; poll(); return; }
  const snd = e.target.closest("#phone-sound");
  if (snd && window.QuizMusic) { snd.textContent = QuizMusic.toggle() ? "🔇" : "🔊"; return; }
  const here = e.target.closest("[data-play-here]");
  if (here) { if (hereAudio) hereAudio.pause(); hereAudio = new Audio(here.dataset.playHere); hereAudio.play().catch(() => {}); here.remove(); return; }
  const bn = e.target.closest("[data-bet-next]"); // ставка ×2 на следующий вопрос (не путать с [data-bet] — ставкой «Своей игры»)
  if (bn) { buzz(bn.dataset.betNext === "1" ? [30, 50, 30] : 15); bn.disabled = true; await api("/api/double", { pid, on: bn.dataset.betNext === "1" }).catch(() => {}); lastSig = ""; poll(); return; }
  const choice = e.target.closest("[data-choice]");
  if (choice) return send(Number(choice.dataset.choice));
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    const i = Number(pick.dataset.pick);
    picks = picks.includes(i) ? picks.filter((x) => x !== i) : [...picks, i];
    pick.classList.toggle("sel", picks.includes(i));
    document.getElementById("submit").disabled = !picks.length;
    buzz(10);
    return;
  }
  const seq = e.target.closest("[data-seq]");
  if (seq) {
    const i = Number(seq.dataset.seq);
    if (!picks.includes(i)) { picks.push(i); buzz(10); }
    return paintOrder();
  }
  if (e.target.closest("#reset")) { picks = []; return paintOrder(); }
  if (e.target.closest("#map-send") && mapPick) return send(mapPick);
  if (e.target.closest("#submit") && picks.length) send(lastQuestion && lastQuestion.qtype === "multi" ? picks.slice().sort() : picks.slice());
});

if (room) poll(); else startScreen();
setInterval(pollTick, 700);
</script>
