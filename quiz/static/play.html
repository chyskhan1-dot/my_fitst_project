<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1330">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/media/app/icon-192.png">
<link rel="apple-touch-icon" href="/media/app/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Квиз">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Квиз</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: phone controller — player bar on top, one big scene, answer buttons fill the screen */
:root {
  --bg: #0e1330;
  --bg2: #1a1050;
  --panel: rgba(255, 255, 255, .08);
  --ink: #f4f5ff;
  --muted: #a7aedb;
  --line: rgba(255, 255, 255, .12);
  --accent: #ffd23f;
  --accent-ink: #1a1400;
  --a0: #e5484d; --a1: #3e7bfa; --a2: #f2a516; --a3: #26a269;
  --good: #3ddc84; --bad: #ff6b6b;
  --mood: transparent;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--body); font-size: 17px;
  background: radial-gradient(90% 60% at 50% 100%, var(--mood), transparent 70%) fixed,
              radial-gradient(120% 80% at 0% 0%, var(--bg2), var(--bg) 65%) fixed, var(--bg);
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  transition: background .6s;
}
body[data-mood="good"] { --mood: rgba(61, 220, 132, .35); }
body[data-mood="bad"] { --mood: rgba(255, 107, 107, .3); }
.app { max-width: 520px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; align-items: center; gap: 10px; min-height: 36px; font-weight: 800; }
.top .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .sc { font-family: var(--display); font-size: 15px; padding: 6px 12px; border-radius: 999px; background: var(--panel); font-variant-numeric: tabular-nums; }
main { flex: 1; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
h1, h2 { font-family: var(--display); margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 30px; font-weight: 800; }
h2 { font-size: 20px; font-weight: 500; }
p { margin: 0; line-height: 1.5; }
.muted { color: var(--muted); }
/* «Слово на лбу» */
#hd-face { position: fixed; inset: 0; z-index: 14; /* под «Паузой» */ background: #0e1330; color: #fff; display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none; touch-action: none; transition: background .15s; }
#hd-face[data-flash="ok"] { background: #1f9d57; }
#hd-face[data-flash="pass"] { background: #c77a12; }
#hd-face .hd-word { width: 92vw; height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; white-space: pre-line;
  font-family: var(--display); font-weight: 800; line-height: 1.05; overflow: hidden; pointer-events: none; }
#hd-face .hd-bar { position: absolute; left: 0; right: 0; top: 0; height: 10px; background: rgba(255, 255, 255, .15); }
#hd-face .hd-bar i { display: block; height: 100%; background: var(--accent); transition: width .2s linear; }
#hd-face .hd-left { position: absolute; top: 18px; right: 20px; font: 800 28px var(--display); opacity: .8; pointer-events: none; }
#hd-face .hd-zone { position: absolute; left: 0; right: 0; height: 50%; border: 0; background: transparent; color: rgba(255, 255, 255, .35);
  font: 700 14px var(--body); display: flex; justify-content: center; padding: 22px; }
#hd-face .hd-zone.up { top: 0; align-items: flex-start; padding-top: 30px; }
#hd-face .hd-zone.down { bottom: 0; align-items: flex-end; }
body:has(#hd-face) #hostbar { display: none; } /* у лба кнопки ведущего не нужны — легко задеть */
.hd-howto { text-align: left; margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 17px; }
.big-btn { font-size: 24px; padding: 18px 44px; }
.hd-card { width: 100%; padding: 36px 16px; border-radius: 22px; background: var(--panel); border: 2px solid var(--accent);
  font: 800 54px var(--display); overflow-wrap: anywhere; }
.hd-card.rival { border-color: var(--line); }
.hd-card.wait { border-color: var(--line); color: var(--muted); font-size: 24px; }
.hd-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.hd-list li { padding: 8px 14px; border-radius: 999px; font-weight: 800; }
.hd-list li.ok { background: rgba(61, 220, 132, .18); border: 2px solid var(--good); }
.hd-list li.no { background: var(--panel); color: var(--muted); text-decoration: line-through; }
.scene { display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 800; color: var(--accent); }

.rise { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.pop { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
#main.calm .rise, #main.calm .pop, #main.calm .person { animation: none; } /* тот же экран обновился — без повторной анимации */
@keyframes pop { from { opacity: 0; transform: scale(.4); } }

.ava {
  width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 14px; color: #fff; background: var(--c);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2);
}
.ava.xl { width: 84px; height: 84px; font-size: 34px; }

form { display: flex; flex-direction: column; gap: 12px; width: 100%; }
input {
  font: 700 20px var(--body); padding: 16px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); width: 100%; text-align: center;
}
.btn {
  font: 800 18px var(--body); padding: 16px; border-radius: 16px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15);
}
.btn:disabled { opacity: .5; }
.error { color: var(--bad); font-weight: 700; min-height: 1.5em; }

.timebar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.timebar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transform-origin: left; animation: shrink linear forwards; }
@keyframes shrink { to { transform: scaleX(0); background: var(--bad); } }
.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; flex: 1; max-height: 470px; }
.ans {
  border: 0; border-radius: 20px; color: #fff; cursor: pointer; padding: 14px; background: var(--c);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font: 800 16px var(--body); min-height: 120px; min-width: 0; overflow-wrap: anywhere;
  box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .2); transition: transform .1s;
}
.ans:active { transform: scale(.95); }
.ans:disabled { opacity: .5; }
.ans:focus-visible, .btn:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.big { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1.1; }
.good { color: var(--good); } .bad { color: var(--bad); }
.pill { padding: 8px 16px; border-radius: 999px; background: var(--panel); font-weight: 800; font-variant-numeric: tabular-nums; }
.pill.plus { background: var(--good); color: #062b16; font-family: var(--display); font-size: 20px; padding: 10px 20px; }
.picked { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 14px; color: #fff; font-weight: 800; background: var(--c); }
.spinner { width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.place { font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 1; }
.move { font-weight: 800; }
.move.up { color: var(--good); } .move.down { color: var(--bad); }
.mini { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 8px; }
.mini li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--panel); font-weight: 700; font-variant-numeric: tabular-nums; text-align: left; }
.mini li.me { outline: 2px solid var(--accent); }
.mini .pos { width: 1.5em; color: var(--muted); font-family: var(--display); }
.round-done { padding: 10px 16px; border-radius: 14px; background: rgba(255, 210, 63, .14); color: var(--accent); font-weight: 800; text-align: center; }
.mini .t { flex: none; color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; }
.mini .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .gain { color: var(--muted); font-size: 13px; min-width: 4.5ch; text-align: right; }
.mini .gain.up { color: var(--good); } .mini .gain.down { color: var(--bad); }
.mini .sc { min-width: 4ch; text-align: right; }
/* голосование за тему: три большие карточки на весь экран */
.topic-list { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 62vh; }
.topic-btn { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  width: 100%; border: 0; border-radius: 22px; padding: 14px; background: var(--c); color: #fff; font: 800 22px/1.15 var(--body);
  text-align: center; cursor: pointer; box-shadow: inset 0 -6px 0 rgba(0,0,0,.2); transition: transform .1s; }
.topic-btn:active { transform: scale(.97); }
.topic-btn .ti { font-size: 52px; line-height: 1; }
.topic-btn small { position: absolute; top: 10px; right: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.28); font-size: 13px; }
.topic-btn.on { outline: 4px solid var(--ink); outline-offset: 3px; }
.topic-list:has(.on) .topic-btn:not(.on) { opacity: .6; }
.topic-res { opacity: 0; transition: opacity .5s; display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; }
.topic-res.shown { opacity: 1; }
.topic-res:not(.shown) { pointer-events: none; } /* пока колесо крутится, ставку не сделать */
.sound-btn { border: 0; background: none; font-size: 20px; cursor: pointer; padding: 4px 8px; }
.ans .opt-img { height: 60px; width: 90px; object-fit: contain; flex: none; border-radius: 6px; } /* флаг, планета у варианта */
.mini .n small { display: block; font-weight: 600; font-size: 13px; color: var(--muted); white-space: normal; }
.others { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.pill.minus { background: var(--bad); color: #2b0606; font-family: var(--display); font-size: 20px; padding: 10px 20px; }
.teampick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; }
.teampick button {
  font: 800 16px var(--body); padding: 14px 10px; border-radius: 14px; cursor: pointer; color: var(--ink);
  background: var(--panel); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 8px;
}
.teampick button::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: var(--c); flex: none; }
.teampick button.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 25%, transparent); }
.teampick small { color: var(--muted); font-weight: 700; }
.teambadge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; font-weight: 800; background: var(--c); color: #fff; }
.roles { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.role {
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 14px; text-align: left; align-items: center;
  padding: 18px; border-radius: 18px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; cursor: pointer;
}
.role .ico { grid-row: span 2; font-size: 34px; }
.role b { font-family: var(--display); font-size: 19px; }
.role small { color: var(--muted); }
.role { transition: border-color .15s, background .15s, transform .1s; }
.role:hover { border-color: var(--muted); }
.role:active { transform: scale(.98); }
.role.on { border-color: var(--accent); background: rgba(255, 210, 63, .14); }
.role.on b { color: var(--accent); }
a.role { color: inherit; text-decoration: none; text-align: left; }
#resume:empty { display: none; }
.role:disabled { cursor: default; }
.role:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.code-input { font-family: var(--display); font-size: 40px; letter-spacing: .3em; padding: 14px 10px 14px calc(10px + .3em); }
.qimg { display: block; max-width: 100%; max-height: 28vh; margin: 0 auto; border-radius: 12px; background: #fff; }
.qimg.answer-pic { max-height: 26vh; }
.qimg.answer-pic.photo { width: 100%; max-height: 44vh; object-fit: contain; background: none; } /* фото, портрет, флаг — во всю ширину */
/* эффект картинки: размыта и проясняется / виден кусочек и отдаляется */
.fx { display: block; width: fit-content; max-width: 100%; margin: 0 auto; overflow: hidden; border-radius: 16px; line-height: 0; }
.fx .qimg { box-shadow: none; }
.fx-blur .qimg { animation: unblur var(--t) linear var(--d) both; }
.fx-zoom .qimg { transform-origin: var(--fx); animation: unzoom var(--t) linear var(--d) both; }
@keyframes unblur { from { filter: blur(32px); } to { filter: blur(4px); } }
@keyframes unzoom { from { transform: scale(5); } to { transform: scale(1.5); } }

.ans { position: relative; }
.ans.sel { outline: 4px solid var(--ink); outline-offset: -4px; filter: brightness(1.1); }
.ans:not(.sel) .badge-num:empty { display: none; }
.badge-num { position: absolute; top: 8px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); font: 800 16px var(--display); display: grid; place-items: center; }
.badge-num:empty { display: none; }
.hint { color: var(--muted); text-align: center; font-weight: 700; font-size: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.btn.ghost { background: var(--panel); color: var(--ink); }
.text-form { display: flex; flex-direction: column; gap: 10px; }
.phone-map { width: 100%; height: 46vh; min-height: 240px; flex: none; }
.phone-map.small { height: 34vh; min-height: 200px; }
.text-form input { font: 700 22px var(--body); padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-align: center; width: 100%; }
.stack { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.ava.emo { background: var(--panel); box-shadow: none; font-size: 20px; }
.ava.emo.xl { font-size: 46px; }
.avatars { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; width: 100%; }
.av { font-size: 24px; aspect-ratio: 1; border-radius: 12px; border: 2px solid transparent; background: var(--panel); cursor: pointer; padding: 0; }
.av.on { border-color: var(--accent); background: rgba(255, 210, 63, .18); }
.ava-change { width: 100%; }
.ava-change summary { color: var(--muted); cursor: pointer; font-size: 14px; font-weight: 700; text-align: center; margin-bottom: 8px; }
.marks { display: inline-flex; gap: 3px; flex: none; }
.mk { font-style: normal; display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; font-size: .8em; font-weight: 900;
  background: rgba(255,255,255,.1); color: var(--muted); }
.mk.right { background: var(--good); color: #0b1a10; } .mk.partial { background: #ffd23f; color: #2a2000; } .mk.wrong { background: var(--bad); color: #fff; }
/* подлянки */
.trick-box { width: 100%; padding: 14px; border-radius: 16px; background: rgba(229, 72, 77, .14); border: 2px solid var(--a0); display: flex; flex-direction: column; gap: 8px; text-align: center; }
.trick-box b { font-size: 18px; } .trick-box p { margin: 0; }
.trick-who { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.trick-to { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 999px; border: 2px solid transparent;
  background: #2a2f5a; color: var(--ink); font: 700 14px var(--body); cursor: pointer; }
.trick-to.on { border-color: var(--a0); background: rgba(229, 72, 77, .3); }
.trick-throw { width: 100%; background: var(--a0); color: #fff; }
.trick-got { margin: 0; padding: 12px; border-radius: 12px; background: #2a2f5a; font-weight: 800; font-size: 18px; display: flex; flex-direction: column; gap: 3px; }
.trick-got small { font-weight: 600; font-size: 13px; color: var(--muted); }
.qbody { display: contents; }
.trick-banner { padding: 10px 14px; border-radius: 12px; background: var(--a0); color: #fff; font-weight: 800; text-align: center; }
.trick-wait { padding: 40px 10px; text-align: center; font-weight: 800; font-size: 18px; border-radius: 16px; background: var(--panel); }
.trick-wait b { font-family: var(--display); font-size: 1.4em; color: var(--accent); }
.ans.plain { background: #4a4f72; }
.trick-flip .ans .tx { display: inline-block; transform: rotate(180deg); }
.trick-mirror .ans .tx { display: inline-block; transform: scaleX(-1); }
.trick-fog .answers, .trick-fog .text-form { animation: defog 14s linear both; animation-delay: var(--fog-d, 0s); }
@keyframes defog { from { filter: blur(9px); } 70% { filter: blur(3px); } to { filter: blur(0); } }
.lobby-people { width: 100%; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.people { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.person { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 999px; background: var(--panel);
  border: 2px solid var(--c, transparent); font-weight: 700; font-size: 14px; animation: rise .35s ease both; }
.person.me { background: rgba(255, 210, 63, .18); }
.person.off { opacity: .45; }
.small-note { font-size: 13px; }
.note { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--panel); border-left: 4px solid var(--accent); font-weight: 600; font-size: 15px; line-height: 1.4; text-align: left; }
.flash { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--good); color: #062b16; padding: 10px 18px; border-radius: 12px; font-weight: 800; z-index: 9; }
.emoji-pic { font-size: 56px; text-align: center; letter-spacing: .06em; line-height: 1.15; }
.si-pick { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.si-pick-theme { font-weight: 800; font-size: 13px; color: var(--muted); margin-top: 6px; }
.si-pick-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.si-pick-cell { font: 800 15px var(--display); color: var(--accent); background: #1d2a8a; border: 0; border-radius: 10px; padding: 12px 0; cursor: pointer; }
.si-pick-cell.played { background: transparent; border: 1px dashed var(--line); }
.buzz { width: 100%; aspect-ratio: 1; max-height: 52vh; border-radius: 50%; border: 0; font: 800 30px var(--display); cursor: pointer;
  background: #3a2230; color: var(--muted); box-shadow: inset 0 -10px 0 rgba(0, 0, 0, .3); transition: background .15s, transform .08s; align-self: center; max-width: 340px; }
.buzz.open { background: var(--bad); color: #fff; box-shadow: 0 0 0 8px rgba(255, 107, 107, .25), inset 0 -10px 0 rgba(0, 0, 0, .25); }
.buzz:active:not(:disabled) { transform: scale(.96); }
.buzz:disabled { opacity: .55; }
.btn.wide { width: 100%; }
.leave { background: none; border: 0; color: var(--muted); font: 600 14px var(--body); text-decoration: underline; cursor: pointer; }
.install-help { font-size: 15px; margin: 6px 0 0; }
#confetti { position: fixed; inset: 0; pointer-events: none; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; }
  .timebar i { animation: none; }
  .fx-blur .qimg { animation: none; filter: blur(14px); }
  .fx-zoom .qimg { animation: none; transform: scale(3); }
}
/* панель ведущего, который играет сам */
#hostbar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; align-items: center; justify-content: center;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(14, 19, 48, .92); backdrop-filter: blur(8px); border-top: 1px solid var(--line); z-index: 5; }
#hostbar:empty { display: none; }
#hostbar { z-index: 16; }
#hostbar .btn.pz { flex: none; max-width: none; }
/* пауза: полоски времени и проявление картинок замирают (появление элементов — нет), поверх — табличка */
body.paused .timebar i, body.paused .fx-blur .qimg, body.paused .fx-zoom .qimg, body.paused .trick-fog .answers,
body.paused .trick-fog .text-form, body.paused .eq i { animation-play-state: paused !important; }
#paused { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; align-content: center; gap: 6px;
  background: rgba(5, 8, 25, .72); text-align: center; padding: 16px; }
#paused b { font: 800 clamp(34px, 8vw, 72px) var(--display); }
#paused span { color: var(--muted); font-weight: 700; }
body.paused #main { pointer-events: none; }
#hostbar .btn { flex: 1; max-width: 320px; padding: 12px 16px; }
#hostbar .hb-note { flex: none; color: var(--muted); font-weight: 700; font-size: 13px; }
#hostbar .tv { flex: none; color: var(--muted); text-decoration: none; font-size: 22px; padding: 6px; }
body.has-hostbar { padding-bottom: 84px; }
/* пропуск и ставка ×2 */
.extra { display: flex; gap: 10px; }
.extra .btn { flex: 1; padding: 12px; font-size: 15px; }
.extra .btn small { display: block; font-weight: 700; color: var(--muted); font-size: 12px; }
.bet-next { width: 100%; display: flex; flex-direction: column; gap: 2px; }
.bet-next small { font-weight: 600; font-size: 12px; color: var(--muted); }
.bet-next.on { background: var(--accent); color: var(--accent-ink); }
.bet-next.on small { color: var(--accent-ink); }
.pill.x2 { background: var(--accent); color: var(--accent-ink); font-family: var(--display); }
/* новости после вопроса */
.news { width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.news div { padding: 10px 14px; border-radius: 12px; background: var(--panel); font-weight: 700; font-size: 15px; line-height: 1.35; animation: rise .4s ease both; animation-delay: calc(.6s + var(--i) * .5s); }
.news b { color: var(--accent); }
/* «100 к 1» */
.fd-list { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 6px; }
.fd-list li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--panel); font-weight: 800; text-align: left; }
.fd-list li .n { color: var(--muted); width: 1.2em; }
.fd-list li .t { flex: 1; text-transform: uppercase; }
.fd-list li.on { background: var(--accent); color: #1a1400; }
.fd-list li.on .n { color: inherit; }
.fd-list li.miss { color: var(--muted); }
.fd-x { font: 800 30px var(--display); color: var(--line); }
.fd-x.on { color: var(--bad); }
.fd-said { font-weight: 700; margin: 0; }
.fd-said.bad { color: var(--bad); } .fd-said.good { color: var(--good); }
</style>
</head>
<body>
<canvas id="confetti" hidden></canvas>
<div class="app">
  <div class="top" id="top"></div>
  <main id="main"><div class="scene"><div class="spinner"></div><p class="muted">Подключаюсь…</p></div></main>
</div>

<script src="/static/comments.js"></script>
<script src="/static/map.js"></script>
<script src="/static/emoji.js"></script>
<script src="/static/music.js"></script>
<script src="/static/wheel.js"></script>
<script src="/static/rope.js"></script>
<script>
const COLORS = ["#e5484d", "#3e7bfa", "#f2a516", "#26a269", "#a855f7", "#ec4899", "#14b8a6", "#f97316"];
const $main = document.getElementById("main");
let room = (new URLSearchParams(location.search).get("room") || "").replace(/\D/g, "").slice(0, 4);
let pid = room ? load() : null, version = null, lastSig = "", sending = false, lastState = null, pickTeam = null, joinTeams = -1;
const TEAM_COLORS = ["var(--a0)", "var(--a1)", "var(--a2)", "var(--a3)"];

function teamPicker(s, selected) {
  return `<div class="teampick">${s.teams.slice().sort((a, b) => a.team - b.team).map((t) => `
    <button type="button" class="${t.team === selected ? "on" : ""}" style="--c:${TEAM_COLORS[t.team]}" data-team="${t.team}">
      ${esc(t.name)} <small>${t.size}</small></button>`).join("")}</div>`;
}

function load() { try { return localStorage.getItem("quiz-pid-" + room); } catch { return null; } }
function save(v) {
  try {
    v ? localStorage.setItem("quiz-pid-" + room, v) : localStorage.removeItem("quiz-pid-" + room);
    if (v) localStorage.setItem("quiz-last-room", room); // чтобы с главной можно было вернуться в игру
  } catch {}
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function color(name) { let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const ava = (name, cls = "") => `<span class="ava ${cls}" style="--c:${color(name)}">${esc([...name][0].toUpperCase())}</span>`;
const isEmojiPic = (v) => /media\/pics\/ans-/.test(v || ""); // объёмный смайлик к ответу — не растягивать
const mediaSrc = (v) => (/^(data:|https?:|\/)/.test(v) ? v : "/" + v);
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
const mood = (m) => { document.body.dataset.mood = m || ""; };

async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ room, ...body }), signal: timeout(10000) });
  return r.json();
}

function setRoom(code) {
  room = code; pid = code ? load() : null; lastSig = ""; lastState = null; joinTeams = -1;
  history.replaceState(null, "", code ? "/?room=" + code : "/");
}

function startScreen() {
  setRoom("");
  document.getElementById("top").innerHTML = "";
  mood("");
  $main.innerHTML = `
    <div class="scene">
      <div class="eyebrow rise">Квиз</div>
      <h1 class="rise" style="--i:1">Кто ты сегодня?</h1>
      <div class="roles" id="resume"></div>
      <div class="roles">
        <button class="role rise" style="--i:2" id="as-player"><span class="ico">📱</span><b>Я игрок</b><small>Есть код комнаты от ведущего</small></button>
        <button class="role rise" style="--i:3" id="as-host"><span class="ico">🎤</span><b>Я ведущий</b><small>Создать игру и показывать вопросы на большом экране</small></button>
        <a class="role rise" style="--i:4" href="/learn"><span class="ico">📚</span><b>Тренировка</b><small>Учи флаги, столицы и страны в своём темпе</small></a>
      </div>
      <div class="error" id="err"></div>
      <button class="leave" type="button" data-share-site>📤 Поделиться игрой с друзьями</button>
      <button class="leave" type="button" data-install hidden>📲 Установить на телефон</button>
      <p class="muted install-help" id="install-help" hidden></p>
    </div>`;
  showInstall();
  const choose = (btn) => document.querySelectorAll(".role").forEach((r) => r.classList.toggle("on", r === btn));
  document.getElementById("as-player").onclick = (e) => {
    choose(e.currentTarget);
    setTimeout(codeForm, 180); // успеть показать выбор
  };
  let mine = null; // своя игра ведущего на этом устройстве
  document.getElementById("as-host").onclick = async (e) => {
    if (mine && mine.players && !["setup", "final"].includes(mine.phase)
      && !confirm(`Игра в комнате ${mine.room} ещё идёт. Закончить её и создать новую?`)) return;
    choose(e.currentTarget);
    e.currentTarget.disabled = true;
    e.currentTarget.querySelector("small").textContent = "Создаю комнату…";
    const res = await api("/api/rooms", {}).catch(() => ({ error: "Нет связи с сервером" }));
    if (res.error) { document.getElementById("err").textContent = res.error; e.currentTarget.disabled = false; return; }
    try { localStorage.setItem("quiz-host-" + res.room, res.token); } catch {}
    location.href = "/host?room=" + res.room;
  };
  resumeOffers().then((m) => { mine = m; });
}

// Кнопки «Вернуться в игру»: ведущему — к своей комнате, игроку — к последней игре
async function resumeOffers() {
  const box = document.getElementById("resume");
  const offers = [];
  const host = await api("/api/my_room", {}).catch(() => ({}));
  if (host.room) {
    try { localStorage.setItem("quiz-host-" + host.room, host.token); } catch {}
    offers.push(`<a class="role on rise" href="/host?room=${host.room}"><span class="ico">↩️</span><b>Вернуться к своей игре</b>
      <small>Комната ${host.room} · ${esc(host.title)} · игроков: ${host.players}</small></a>`);
  }
  const last = recall("quiz-last-room"), lastPid = last ? recall("quiz-pid-" + last) : "";
  if (last && lastPid && last !== host.room) {
    const s = await fetch(`/api/state?room=${last}&pid=${encodeURIComponent(lastPid)}`, { cache: "no-store" })
      .then((r) => r.json()).catch(() => ({}));
    if (s.me && s.phase !== "final") {
      offers.push(`<button class="role on rise" data-resume="${last}"><span class="ico">↩️</span><b>Вернуться в игру</b>
        <small>Комната ${last} · ${esc(s.title)} · ты — ${esc(s.me.name)}, ${s.me.score} очков</small></button>`);
    }
  }
  if (box && document.body.contains(box)) {
    box.innerHTML = offers.join("");
    box.querySelectorAll("[data-resume]").forEach((b) => (b.onclick = () => { setRoom(b.dataset.resume); poll(); }));
  }
  return host.room ? host : null;
}

function codeForm() {
  $main.innerHTML = `
    <div class="scene">
      <div class="eyebrow rise">Вход в игру</div>
      <h1 class="rise" style="--i:1">Код комнаты</h1>
      <p class="muted rise" style="--i:1">Он на экране у ведущего</p>
      <form id="code" class="rise" style="--i:2">
        <input id="room" class="code-input" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="0000" aria-label="Код комнаты" required>
        <div class="error" id="err"></div>
        <button class="btn" type="submit">Дальше</button>
      </form>
      <button class="leave" id="back">Назад</button>
    </div>`;
  document.getElementById("back").onclick = startScreen;
  document.getElementById("code").addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = document.getElementById("room").value.replace(/\D/g, "");
    const r = await fetch("/api/state?room=" + code, { cache: "no-store" }).catch(() => null);
    if (!r || !r.ok) { document.getElementById("err").textContent = r ? "Комнаты с таким кодом нет" : "Нет связи с сервером"; return; }
    setRoom(code); poll();
  });
  document.getElementById("room").focus();
}

const remember = (k, v) => { try { v == null ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch {} };
const recall = (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
let trickTimer = 0, trickTo = null; // кому подлянка (по умолчанию — лидеру)
let pickAva = recall("quiz-avatar") || null, avaOpen = false, lastScene = "";
const avaP = (p, cls = "") => (p.avatar ? `<span class="ava emo ${cls}">${QuizEmoji.html(p.avatar)}</span>` : ava(p.name, cls));

function avatarPicker(list, selected) {
  return `<div class="avatars" role="group" aria-label="Аватарка">${list.map((a) =>
    `<button type="button" class="av ${a === selected ? "on" : ""}" data-ava="${esc(a)}" aria-label="${esc(a)}">${QuizEmoji.html(a)}</button>`).join("")}</div>`;
}

function joinForm() {
  const s = lastState;
  document.getElementById("top").innerHTML = "";
  mood("");
  // во время игры команду назначит сервер — выбирать её можно только в лобби
  const teams = s && s.phase === "lobby" ? s.settings.teams : 0;
  joinTeams = teams;
  if (teams && (pickTeam == null || pickTeam >= teams)) {
    const smallest = s.teams.slice().sort((a, b) => a.size - b.size || a.team - b.team)[0];
    pickTeam = smallest.team;
  }
  $main.innerHTML = `
    <div class="scene">
      <div class="eyebrow rise">Комната ${esc(room)}</div>
      <h1 class="rise" style="--i:1">Как тебя записать?</h1>
      <form id="join" class="rise" style="--i:2">
        <input id="name" maxlength="20" autocomplete="nickname" placeholder="Твоё имя" aria-label="Имя" required value="${esc(recall("quiz-name"))}">
        ${s && s.avatars ? `<p class="muted">Выбери аватарку:</p>${avatarPicker(s.avatars, pickAva)}` : ""}
        ${teams ? `<p class="muted">Выбери команду:</p>${teamPicker(s, pickTeam)}` : ""}
        <div class="error" id="err"></div>
        <button class="btn" type="submit">Войти в игру</button>
      </form>
      <p class="muted small-note">Вылетел из игры? Введи то же имя — очки вернутся.</p>
      <button class="leave" id="other">Другая комната</button>
    </div>`;
  document.getElementById("other").onclick = startScreen;
  document.getElementById("join").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; // не первая кнопка формы — это аватарка
    const name = document.getElementById("name").value;
    const res = await api("/api/join", { name, avatar: pickAva, team: joinTeams ? pickTeam : null }).catch(() => ({ error: "Нет связи с сервером" }));
    if (res.error) { document.getElementById("err").textContent = res.error; btn.disabled = false; return; }
    remember("quiz-name", name.trim());
    pid = res.pid; save(pid); lastSig = ""; buzz(20);
    if (res.restored) flash(`С возвращением! Очки сохранены: ${res.score}`);
    poll();
  });
  const nameInput = document.getElementById("name");
  if (!nameInput.value) nameInput.focus();
}

function flash(text) {
  const t = document.createElement("div");
  t.className = "flash"; t.textContent = text; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 4000);
}

let draftQ = -1, picks = [], typed = "", lastQuestion = null, mapPick = null, draftTimer = null;
function sendDraft(s) {
  if (sending || draftQ !== s.index || !lastState || lastState.phase !== "question" || lastState.me.answered) return;
  if (s.qtype === "map" && mapPick) return send(mapPick);
  if (s.qtype === "multi" && picks.length) return send(picks.slice().sort());
  if (s.qtype === "order" && picks.length === s.options.length) return send(picks.slice());
  if (s.qtype === "text" && typed.trim()) return send(typed.trim());
  const n = Number(typed.replace(/\s/g, "").replace(",", ".").replace(/[−–]/g, "-"));
  if (s.qtype === "number" && typed.trim() && Number.isFinite(n)) return send(n);
}
const LEVEL_NAMES = { easy: "лёгкий", normal: "средний", hard: "сложный" };

// картинка с эффектом: анимация длится всё время вопроса (с учётом уже прошедшего)
function fxImg(s, alt) {
  const img = `<img class="qimg" src="${esc(mediaSrc(s.image))}" alt="${alt}">`;
  if (!s.image_fx) return img;
  const [x, y] = s.focus || [50, 50];
  return `<div class="fx fx-${s.image_fx}" style="--t:${s.seconds}s;--d:-${Math.max(0, s.seconds - s.left).toFixed(1)}s;--fx:${x}% ${y}%">${img}</div>`;
}

// «Подлянки»: на телефоне лидера текст портится, кнопки перемешаны и одного цвета (по экрану ведущего не сверить)
const trickText = (s, t) => (s.me && s.me.trick === "vowels" ? String(t).replace(/[аеёиоуыэюяaeiouy]/gi, "_") : t);
function trickOrder(s) {
  const ids = s.options.map((_, i) => i);
  if (!s.me || !s.me.trick || s.qtype === "order") return ids;
  let seed = s.index * 7919 + 13;
  for (let i = ids.length - 1; i > 0; i--) { seed = (seed * 16807) % 2147483647; const j = seed % (i + 1); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  return ids;
}
// «Ставка ×2» вслепую: делается между вопросами, на следующий (его ещё никто не видел); передумать — до начала вопроса
function betBox(me) {
  if (!me.can_bet) return "";
  return me.next_double
    ? `<button class="btn bet-next on" data-bet-next="0" type="button">✓ ×2 на следующий вопрос<small>нажми, чтобы отменить</small></button>`
    : `<button class="btn ghost bet-next" data-bet-next="1" type="button">×2 на следующий вопрос<small>вслепую: верно — очки ×2, ошибка или пропуск — минус 1000 · осталось ${me.doubles}</small></button>`;
}

function trickBox(s, me) {
  const t = s.trick_next;
  if (!t || !s.tricks) return "";
  if (me.can_trick) {
    const others = s.players.filter((p) => p.name !== me.name);
    if (!others.some((p) => p.id === trickTo)) trickTo = t.leader;
    return `<div class="trick-box pop"><b>😈 Подлянка!</b><p class="muted">Ты на последнем месте — испорти кому-нибудь следующий вопрос. Кому?</p>
    <div class="trick-who">${others.map((p) => `<button class="trick-to ${p.id === trickTo ? "on" : ""}" data-trick-to="${esc(p.id)}" type="button">${avaP(p)}${esc(p.name)}${p.id === t.leader ? " 👑" : ""}</button>`).join("")}</div>
    <p class="muted">Какая подлянка достанется — решит случай</p>
    <button class="btn trick-throw" data-trick type="button">🎲 Кинуть подлянку</button></div>`;
  }
  if (t.chosen && t.by === me.name) {
    const k = s.tricks.find((x) => x.id === me.trick_sent);
    return `<div class="trick-box pop"><b>😈 Подлянка летит! Кому: ${esc(t.to)}</b>${k ? `<p class="trick-got">Выпало: ${k.name}<small>${k.desc}</small></p>` : ""}
      <p class="muted">Сработает на следующем вопросе</p></div>`;
  }
  if (t.chosen && t.to === me.name) return `<div class="trick-box"><b>😈 Тебе готовят подлянку!</b><p class="muted">Автор — ${esc(t.by)}. Сюрприз будет на следующем вопросе</p></div>`;
  return "";
}

function answerControls(s) {
  const pic = (i) => (s.option_images ? `<img class="opt-img" src="${esc(mediaSrc(s.option_images[i]))}" alt="">` : "");
  const plain = s.me && s.me.trick;
  const btn = (i, attr, extra = "", n = i) => `<button class="ans rise ${extra} ${plain ? "plain" : ""}" style="--c:var(--a${i});--i:${n}" ${attr}="${i}">
    ${pic(i)}<span class="tx">${esc(trickText(s, s.options[i]))}</span><span class="badge-num"></span></button>`;
  const order = trickOrder(s);
  if (s.qtype === "multi") {
    return `<p class="hint">Отметь все верные варианты</p>
      <div class="answers">${order.map((i, n) => btn(i, "data-pick", picks.includes(i) ? "sel" : "", n)).join("")}</div>
      <button class="btn" id="submit" ${picks.length ? "" : "disabled"}>Ответить</button>`;
  }
  if (s.qtype === "order") {
    return `<p class="hint">Нажимай варианты по порядку: первый, второй…</p>
      <div class="answers">${s.options.map((_, i) => btn(i, "data-seq")).join("")}</div>
      <div class="row2"><button class="btn ghost" id="reset">Сначала</button><button class="btn" id="submit" disabled>Ответить</button></div>`;
  }
  if (s.qtype === "number") {
    return `<form id="text-form" class="text-form">
      <input id="answer-text" maxlength="20" inputmode="decimal" autocomplete="off" placeholder="Число${s.unit ? ", " + esc(s.unit) : ""}" aria-label="Твой ответ — число">
      <button class="btn" type="submit">Ответить</button></form>
      <p class="hint">Побеждает тот, кто ближе всех к правильному ответу</p>`;
  }
  if (s.qtype === "map") {
    return `<div class="phone-map" id="phone-map"></div>
      <p class="hint">Нажми на карту — там будет твоя точка. Увеличить — двумя пальцами или «+»</p>
      <button class="btn" id="map-send" ${mapPick ? "" : "disabled"}>Ответить</button>`;
  }
  if (s.qtype === "text") {
    return `<form id="text-form" class="text-form">
      <input id="answer-text" maxlength="60" autocomplete="off" autocapitalize="words" placeholder="Твой ответ" aria-label="Твой ответ">
      <button class="btn" type="submit">Ответить</button></form>
      <p class="hint">Регистр и небольшие опечатки не важны</p>`;
  }
  return `<div class="answers">${order.map((i, n) => btn(i, "data-choice", "", n)).join("")}</div>`;
}

// номера на кнопках «по порядку»
function paintOrder() {
  document.querySelectorAll("[data-seq]").forEach((b) => {
    const k = picks.indexOf(Number(b.dataset.seq));
    b.classList.toggle("sel", k >= 0);
    b.querySelector(".badge-num").textContent = k >= 0 ? k + 1 : "";
  });
  const submit = document.getElementById("submit");
  if (submit) submit.disabled = picks.length !== document.querySelectorAll("[data-seq]").length;
}

function answerSummary(s, answer) {
  const chip = (i, n) => `<span class="picked pop" style="--c:var(--a${i})">${n ? n + ". " : ""}${esc(s.options[i])}</span>`;
  if (s.qtype === "text") return `<span class="pill pop">«${esc(answer)}»</span>`;
  if (s.qtype === "number") return `<span class="pill pop">${Number(answer).toLocaleString("ru-RU")}${s.unit ? " " + esc(s.unit) : ""}</span>`;
  if (s.qtype === "map") return `<span class="pill pop">📍 Точка поставлена</span>`;
  if (Array.isArray(answer)) return `<div class="stack">${answer.map((i, k) => chip(i, s.qtype === "order" ? k + 1 : 0)).join("")}</div>`;
  return chip(answer, 0);
}

function correctAnswer(s) {
  const b = (t) => `<br><b style="color:var(--ink)">${esc(t)}</b>`;
  if (s.qtype === "text") return b(s.correct_text);
  if (s.qtype === "number") return b(Number(s.correct_number).toLocaleString("ru-RU") + (s.unit ? " " + s.unit : ""));
  if (s.qtype === "map") return s.place ? b("📍 " + s.place) : "";
  if (s.qtype === "order") return s.correct_order.map((o, i) => b(`${i + 1}. ${o}`)).join("");
  if (Array.isArray(s.correct)) return s.correct.map((i) => b(s.options[i])).join("");
  return b(s.options[s.correct]);
}

// ---------- «Своя игра» ----------
const siPost = (action, body = {}) => api("/api/si/" + action, { pid, ...body }).catch(() => ({}));
let buzzTimer = null;

function siTextForm(id, placeholder, button) {
  return `<form id="${id}" class="text-form">
    <input id="${id}-input" maxlength="80" autocomplete="off" autocapitalize="sentences" placeholder="${placeholder}" aria-label="${placeholder}">
    <button class="btn" type="submit">${button}</button></form>`;
}

function bindForm(id, action, field) {
  const form = document.getElementById(id);
  if (!form) return;
  const input = document.getElementById(id + "-input");
  input.focus();
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const value = input.value.trim();
    if (!value) return;
    form.querySelector("button").disabled = true;
    await siPost(action, { [field]: field === "amount" ? Number(value) : value });
    buzz(25); lastSig = ""; poll();
  });
}

// звук вопроса играет на экране ведущего; ведущий без телевизора может включить его на своём телефоне
let hereAudio = null;
function siSoundHint(c) {
  if (!c.audio && !c.melody && !c.video) return "";
  return `<p class="hint">🎵 Звучит на экране ведущего</p>${hostToken() && c.audio ? `<button class="btn ghost small" data-play-here="${esc(mediaSrc(c.audio))}" type="button">🔊 Включить на этом телефоне</button>` : ""}`;
}

// ---------- «100 к 1» ----------
function renderFd(s, me) {
  const fd = s.fd, m = fd.me || {}, c = fd.cur || {}, b = fd.big || {}, names = s.team_names;
  mood("");
  // что игрок успел напечатать, не теряем при перерисовке
  const fkey = [s.phase, fd.round_index, b.i].join(":");
  const old = document.getElementById("fd-form"), keep = old && old.dataset.key === fkey ? old.querySelector("input").value : "";
  const scene = (html) => `<div class="scene">${html}</div>`;
  const badge = (t) => `<span class="teambadge" style="--c:${TEAM_COLORS[t]}">${esc(names[t])}</span>`;
  const scores = `<p class="muted">${esc(names[0])} <b style="color:var(--ink)">${fd.team_scores[0]}</b> · ${esc(names[1])} <b style="color:var(--ink)">${fd.team_scores[1]}</b></p>`;
  const timebar = (left) => left != null ? `<div class="timebar" style="width:100%"><i style="animation-duration:${left}s"></i></div>` : "";
  const strikes = () => `<div>${[0, 1, 2].map((k) => `<span class="fd-x ${k < c.strikes ? "on" : ""}">✗</span>`).join(" ")}</div>`;
  // табло на телефоне: открытые ответы видны — можно играть и без большого экрана
  const slots = () => `<ol class="fd-list">${c.slots.map((x) => `<li class="${x.opened ? "on" : x.text ? "miss" : ""}"><span class="n">${x.n}</span>
    <span class="t">${x.text ? esc(x.text) : "• • •"}</span>${x.points != null ? `<b>${x.points}</b>` : ""}</li>`).join("")}</ol>`;
  const last = (c.log || []).slice(-1)[0];
  const form = (button) => `${siTextForm("fd-form", "Твой ответ", button)}<p class="hint">Пиши как говоришь — опечатки не страшны</p>`;
  let bind = null;
  if (s.phase === "fd_round") {
    $main.innerHTML = scene(`<div class="eyebrow">Раунд ${fd.round_index + 1} из ${fd.rounds_total}</div><h1>${esc(c.name)}</h1>
      ${c.reverse ? `<p class="muted">Нужен самый <b>редкий</b> ответ — он дороже всех</p>` : c.mult > 1 ? `<span class="pill">Очки × ${c.mult}</span>` : ""}
      ${m.team != null ? badge(m.team) : ""}<p class="muted">${m.team === c.team ? "Ваша команда начинает!" : "Начинают соперники"}</p>`);
  } else if (s.phase === "fd_play") {
    const said = last && last.result === "already" && m.is_guesser ? `<p class="fd-said bad">«${esc(last.text)}» уже открыт — назови другой</p>` : "";
    if (m.is_guesser) {
      $main.innerHTML = `<div class="eyebrow">${esc(c.name)} · твой ход!</div>${timebar(c.left)}<h2>${esc(c.q)}</h2>
        ${slots()}${strikes()}${said}${form("Ответить")}`;
      bind = "guess";
    } else {
      const ours = m.team === c.team;
      $main.innerHTML = scene(`<div class="eyebrow">${esc(c.name)}</div><h2>${esc(c.q)}</h2>${slots()}${strikes()}
        <p class="muted">${ours ? `Отвечает ${esc(c.guesser ? c.guesser.name : "…")} из твоей команды. Скоро твой ход` : `Отвечают соперники. Если ошибутся 3 раза — ваша команда сможет украсть банк!`}</p>
        <span class="pill">Банк: ${c.bank}</span>`);
    }
  } else if (s.phase === "fd_steal") {
    if (m.can_steal) {
      $main.innerHTML = `<div class="eyebrow">⚡ Кража банка — ${c.bank} очков</div>${timebar(c.left)}<h2>${esc(c.q)}</h2>${slots()}
        <p class="hint">Одна попытка на всю команду: посоветуйтесь, ответит первый</p>${form("Забрать банк")}`;
      bind = "guess";
    } else {
      $main.innerHTML = scene(`<h1>⚡ Кража банка</h1><p class="muted">Соперники называют один ответ. Угадают — заберут ${c.bank} очков</p>`);
    }
  } else if (s.phase === "fd_reveal") {
    const won = m.team === c.winner;
    mood(won ? "good" : "bad");
    buzz(won ? [30, 60, 30] : 200);
    $main.innerHTML = scene(`<span class="big pop ${won ? "good" : "bad"}">${won ? "Ваш банк!" : "Банк у соперников"}</span>
      <span class="pill ${won ? "plus" : ""}">${won ? "+" : ""}${c.bank}</span>${slots()}
      ${last && m.team !== c.team && c.steal ? `<p class="muted">Ответ на кражу: «${esc(last.text || "—")}»</p>` : ""}${scores}`);
  } else if (s.phase === "fd_big_intro") {
    $main.innerHTML = scene(`<div class="eyebrow">Финал</div><h1>Большая игра</h1>
      ${m.in_big ? `<p class="muted">Играет ваша команда! ${b.count} вопросов по 25 секунд — отвечает тот, кто быстрее. Цель — ${b.target} очков</p>`
        : `<p class="muted">Играют ${esc(names[b.team])}. Болей за них!</p>`}`);
  } else if (s.phase === "fd_big_q") {
    if (m.in_big) {
      $main.innerHTML = `<div class="eyebrow">Большая игра · ${b.i + 1} из ${b.count} · набрано ${b.total}</div>${timebar(b.left)}
        <h2>${esc(b.q)}</h2>${form("Ответить")}`;
      bind = "big";
    } else {
      $main.innerHTML = scene(`<div class="eyebrow">Большая игра · ${b.i + 1} из ${b.count}</div><h2>${esc(b.q)}</h2>
        <p class="muted">Отвечает команда ${esc(names[b.team])} · набрано ${b.total} из ${b.target}</p>`);
    }
  } else if (s.phase === "fd_big_result") {
    const ok = b.total >= b.target;
    if (m.in_big) mood(ok ? "good" : "bad");
    $main.innerHTML = scene(`<h1>${ok ? "Победа в большой игре! 🎉" : "Большая игра окончена"}</h1>
      <span class="pill">${b.total} из ${b.target}</span>${scores}`);
  }
  if (bind) {
    const input = document.getElementById("fd-form-input");
    input.value = keep;
    document.getElementById("fd-form").dataset.key = fkey;
    bindFd(bind);
  }
}

function bindFd(action) {

// ---------- поделиться ссылкой ----------
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const t = document.createElement("textarea"); // запасной способ для http (дома по Wi-Fi)
  t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch {}
  t.remove();
  return ok;
}

// Android/Chrome сам предлагает установку (beforeinstallprompt) — показываем кнопку; на iPhone такого нет, поэтому подсказка.
let installPrompt = null;
const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isPhone = () => isIOS() || /Android/.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; showInstall(); });
window.addEventListener("appinstalled", () => { installPrompt = null; showInstall(); });
function showInstall() {
  const btn = document.querySelector("[data-install]");
  if (btn) btn.hidden = installed() || !(installPrompt || isPhone());
}
async function install(btn) {
  const help = document.getElementById("install-help");
  if (installPrompt) {
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice.catch(() => ({}));
    if (outcome === "accepted") { installPrompt = null; btn.hidden = true; }
    return;
  }
  help.hidden = false;
  help.innerHTML = isIOS()
    ? "В Safari нажми «Поделиться» <b>⬆️</b> (внизу или в меню «…»), затем «На экран „Домой“»."
    : "Открой меню браузера <b>⋮</b> и выбери «Установить приложение» или «Добавить на главный экран».";
}

// Звук. Телефон ведущего (играет без ТВ — экран ведущего у него не открыт) звучит как большой экран:

const speaker = (s) => !!(s && s.me && hostToken());
const instrumentFor = (s) => s.instrument || QuizMusic.MELODY_INSTRUMENTS[s.index % QuizMusic.MELODY_INSTRUMENTS.length];
let musicKey = "", hereSound = null;
function stopHere() { if (hereSound) { hereSound.pause(); hereSound = null; } if (window.QuizMusic) QuizMusic.stopMelody(); }
function listen(s) { // проиграть звук вопроса на этом телефоне
  if (!window.QuizMusic) return;
  stopHere(); QuizMusic.unlock();
  if (s.melody) QuizMusic.melody(s.melody, s.tempo, instrumentFor(s));
  else if (s.audio) { hereSound = new Audio(mediaSrc(s.audio)); hereSound.play().catch(() => {}); }
}
function soundtrack(s) {
  const M = window.QuizMusic, key = s.phase + ":" + s.index + (s.paused ? ":пауза" : "");
  if (!M || key === musicKey) return;
  musicKey = key;
  if (s.paused) { stopHere(); if (M.styleName) M.stop(0.3); return; }
  if (s.phase !== "question") stopHere();
  if (!speaker(s) || s.phase.startsWith("si_") || s.phase.startsWith("fd_")) { if (M.styleName) M.stop(0.3); return; }
  if (s.phase === "setup" || s.phase === "lobby") M.play("lobby");
  else if (s.phase === "question") {
    if (s.audio || s.melody) M.stop(0.3); else M.play("question");
    if (s.melody || s.audio) setTimeout(() => { if (musicKey === key) listen(s); }, 600);
    else M.sting("start");
  } else if (s.phase === "reveal") { M.stop(0.3); M.sting("reveal"); }
  else if (s.phase === "leaders" || s.phase === "topic_vote") M.play("leaders");
  else if (s.phase === "topic_bet") { M.stop(0.4); setTimeout(() => { if (musicKey.startsWith("topic_bet")) M.sting("reveal"); }, 4300); }
  else if (s.phase === "final") { M.stop(0.3); M.sting("fanfare"); setTimeout(() => { if (musicKey.startsWith("final")) M.play("final"); }, 2600); }
}
// браузер включает звук только после нажатия — открываем его при первом касании
["pointerdown", "touchend", "click"].forEach((t) => document.addEventListener(t, () => { if (window.QuizMusic) QuizMusic.unlock(); }, true));

// Пауза: таймеры на сервере стоят, на экране — табличка поверх всего
const PAUSABLE = (s) => !["setup", "lobby", "final"].includes(s.phase);
function pauseView(s) {
  document.body.classList.toggle("paused", !!s.paused);
  let ov = document.getElementById("paused");
  if (s.paused && !ov) {
    ov = document.createElement("div"); ov.id = "paused";
    ov.innerHTML = "<b>⏸ Пауза</b><span>Время не идёт — ведущий скоро продолжит игру</span>";
    document.body.appendChild(ov);
  } else if (!s.paused && ov) ov.remove();
  // звук и видео вопроса тоже ставим на паузу, а после — продолжаем
  if (s.paused) document.querySelectorAll("audio, video").forEach((m) => { if (!m.paused) { m.dataset.pz = "1"; m.pause(); } });
  else document.querySelectorAll("audio[data-pz], video[data-pz]").forEach((m) => { delete m.dataset.pz; m.play().catch(() => {}); });
}

function hostBar(s) {
  let bar = document.getElementById("hostbar");
  const token = s.me ? hostToken() : "";
  if (!bar) { bar = document.createElement("div"); bar.id = "hostbar"; document.body.appendChild(bar); }
  let label = token && HOST_NEXT[s.phase];
  if (label && s.phase === "si_question" && s.si && s.si.cur && s.si.cur.buzz_open) label = "Никто не знает";
  if (label && s.round_end && s.phase === "leaders" && s.index + 1 < s.total) label = "Следующий раунд";
  if (label && s.phase === "leaders" && (s.race_winner || s.index + 1 >= s.total)) label = "К итогам";
  // ведущий тоже играет: пока сам не ответил, кнопки «Показать ответ» нет — чтобы не нажать её вместо «Ответить»
  if (label && s.phase === "question" && s.me && !s.me.answered) label = "";
  if (label && s.paused) label = ""; // на паузе «Дальше» не нажать — только «Продолжить»
  const pz = token && PAUSABLE(s);
  document.body.classList.toggle("has-hostbar", !!(label || pz));
  const disabled = s.phase === "lobby" && !s.players.length;
  const note = s.phase === "question" ? `Ответили ${s.answered} из ${s.players.length}`
    : s.auto_left != null ? `Дальше через ${Math.ceil(s.auto_left)} с` : "";
  // кнопку пересоздаём, только когда она меняется, — счётчик обновляем текстом, чтобы не терялось нажатие
  const html = !label && !pz ? "" : `<a class="tv" href="/host?room=${room}" title="Экран ведущего">🖥</a>
    ${pz ? `<button class="btn ghost pz" type="button" data-host="pause" data-on="${s.paused ? 0 : 1}" title="${s.paused ? "Продолжить" : "Пауза"}">${s.paused ? "▶ Продолжить" : "⏸"}</button>` : ""}
    <span class="hb-note"></span>
    ${label ? `<button class="btn ${s.phase === "question" ? "ghost" : ""}" type="button" data-host="${s.phase === "final" ? "reset" : "next"}" ${disabled ? "disabled" : ""}>${label}</button>` : ""}`;
  if (bar.dataset.html !== html) { bar.dataset.html = html; bar.innerHTML = html; }
  const nt = bar.querySelector(".hb-note");
  if (nt && nt.textContent !== note) nt.textContent = note;
}

const SKIP = {}; // «Пропустить вопрос»
async function send(answer) {
  if (sending) return;
  sending = true; buzz(25);
  document.querySelectorAll(".ans, #submit, #text-form button, #skip, #map-send").forEach((x) => (x.disabled = true));
  await api("/api/answer", answer === SKIP ? { pid, skip: true } : { pid, answer }).catch(() => {});
  sending = false; lastSig = ""; poll();
}

// те же комментарии, что на большом экране: кто взлетел, кто быстрее всех…
function news(s) {
  const list = window.QuizComments ? QuizComments.comments(s).slice(0, 3) : [];
  return list.length ? `<div class="news">${list.map((c, i) => `<div style="--i:${i}">${c}</div>`).join("")}</div>` : "";
}

// вся таблица: кто сколько заработал за последний вопрос и сколько всего
const MARKS = { right: ["✓", "верно"], partial: ["½", "частично"], wrong: ["✗", "неверно"], skip: ["⏭", "пропустил"], none: ["—", "не ответил"] };
const marks = (p) => (p.marks && p.marks.length ? `<span class="marks">${p.marks.map((m) => `<i class="mk ${m}" title="${MARKS[m][1]}">${MARKS[m][0]}</i>`).join("")}</span>` : "");
function standings(s, me) {
  return `<ol class="mini">${s.players.map((p, i) => `
    <li class="rise ${p.name === me.name ? "me" : ""}" style="--i:${Math.min(i + 2, 12)}">
      <span class="pos">${i + 1}</span>${avaP(p)}<span class="n">${esc(p.name)}</span>${marks(p)}
      ${p.last ? `<span class="gain ${p.last > 0 ? "up" : "down"}">${p.last > 0 ? "+" : "−"}${Math.abs(p.last)}</span>` : `<span class="gain">0</span>`}
      <span class="sc">${p.score}</span></li>`).join("")}</ol>`;
}

const secs = (t) => (t == null ? "" : `${Number(t).toLocaleString("ru-RU", { maximumFractionDigits: 1 })} с`); // за сколько ответил
// верёвка на телефоне: лидеры и ты; конец раунда и победа в гонке — подписью
function phoneRope(s, me) {
  const rows = s.settings.teams
    ? s.teams.map((t) => ({ name: t.name, score: t.score, last: t.last, me: t.team === me.team, face: `<span class="team-face" style="--c:${TEAM_COLORS[t.team]}"></span>` }))
    : (() => {
      const top = s.players.slice(0, 7), mine = s.players.find((p) => p.name === me.name);
      if (mine && !top.includes(mine)) top.push(mine);
      return top.map((p) => ({ name: p.name, score: p.score, last: p.last, me: p.name === me.name, face: avaP(p) }));
    })();
  return QuizRope.html(rows, s.rope_top, `${room}:${s.index}`, { height: "210px", compact: true, race: !!s.settings.race, mountain: true });
}
const roundTitle = (s) => (s.race_winner ? `👑 ${esc(s.race_winner)} — царь горы!`
  : s.round_end ? `Раунд ${s.round_no} из ${s.rounds_total} завершён${s.round_theme ? ` · «${esc(s.round_theme)}»` : ""}` : "");

// ответы всех игроков после вопроса: «кто ближе» — по точности, остальные — сначала верные
function othersAnswers(s, me) {
  const mark = (r) => `<span class="gain ${r === "right" ? "up" : r === "partial" ? "" : "down"}">${r === "right" ? "✓" : r === "partial" ? "½" : "✗"}</span>`;
  const row = (a, i, mid, end) => `<li class="rise ${a.name === me.name ? "me" : ""}" style="--i:${Math.min(i + 3, 12)}">
    <span class="pos">${i + 1}</span>${avaP(a)}<span class="n">${esc(a.name)}${mid ? `<small>${mid}</small>` : ""}</span><span class="t">⏱ ${secs(a.time)}</span>${end}</li>`;
  const num = (n) => Number(n).toLocaleString("ru-RU");
  let rows = [];
  if (s.qtype === "number") rows = (s.number_answers || []).map((a, i) => row(a, i, "",
    `<span class="sc">${num(a.value)}</span><span class="gain ${a.best ? "up" : ""}">${a.diff === 0 ? "🎯" : (a.diff > 0 ? "+" : "−") + num(Math.abs(a.diff))}</span>`));
  else if (s.qtype === "map") rows = (s.map_answers || []).map((a, i) => row(a, i, "", `<span class="sc">${a.best ? "🎯 " : ""}${QuizMap.km(a.km)}</span>`));
  else if (s.qtype === "text") rows = (s.text_answers || []).map((a, i) => row(a, i, "«" + esc(a.text) + "»", mark(a.ok ? "right" : "wrong")));
  else rows = (s.player_answers || []).map((a, i) => {
    const picks = Array.isArray(a.pick) ? a.pick : [a.pick];
    const said = s.qtype === "order" ? picks.map((k, n) => `${n + 1}. ${esc(s.options[k])}`).join(" · ") : picks.map((k) => esc(s.options[k])).join(", ");
    return row(a, i, said, mark(a.result));
  });
  if (!rows.length || (rows.length === 1 && rows[0].includes('class="rise me"'))) return "";
  return `<div class="others"><div class="eyebrow">${s.qtype === "number" || s.qtype === "map" ? "Кто ближе" : "Кто что ответил"}</div><ol class="mini">${rows.join("")}</ol></div>`;
}

function moveText(me) {
  if (!me.prev || me.prev === me.place) return "";
  const d = me.prev - me.place, n = Math.abs(d);
  const w = n % 10 === 1 && n % 100 !== 11 ? "место" : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? "места" : "мест";
  if (me.place === 1) return `<span class="move up">👑 Ты лидер! +${n} ${w}</span>`;
  return d > 0 ? `<span class="move up">🚀 +${n} ${w} вверх</span>` : `<span class="move down">📉 −${n} ${w}</span>`;
}

// Экран перерисовывается целиком; если этап тот же — держим прокрутку на месте (картинки
// подгружаются не сразу, поэтому до их загрузки не даём странице стать короче), новый этап — с начала.
let settleTimer = 0, lastDrawn = "";
function render(s) {
  const scene = s.phase + ":" + s.index, same = scene === lastDrawn, y = window.scrollY;
  lastDrawn = scene;
  clearTimeout(settleTimer);
  $main.style.minHeight = same ? $main.offsetHeight + "px" : "";
  draw(s);
  if (same) {
    window.scrollTo(0, y);
    settleTimer = setTimeout(() => { $main.style.minHeight = ""; }, 1500);
  } else if (y) window.scrollTo(0, 0);
}

// ---------- «Слово на лбу» ----------
// Телефон у лба экраном к друзьям: слово во весь экран. Угадал — наклон вниз (экраном к полу), не знаешь — вверх.
// Наклон считаем по датчику ориентации: v = cos(beta)·cos(gamma) — куда смотрит экран (1 — в потолок, −1 — в пол, 0 — вперёд).
// Новый наклон засчитывается, только когда телефон вернули прямо. Запасной вариант — касание верхней или нижней половины экрана.
const wordsN = (n) => `${n} ${n % 10 === 1 && n % 100 !== 11 ? "слово" : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? "слова" : "слов"}`;
const hd = { word: null, n: 0, end: 0, ready: 0, armed: false, busy: false, flashUntil: 0, timer: null, wake: null, tilt: false };
async function hdStart() {
  try { // iPhone спрашивает разрешение на датчики — только по нажатию
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") hd.tilt = (await DeviceOrientationEvent.requestPermission()) === "granted";
    else hd.tilt = "DeviceOrientationEvent" in window;
  } catch { hd.tilt = false; }
  try { hd.wake = await navigator.wakeLock.request("screen"); } catch {} // экран не гаснет посреди хода
  try { if (document.documentElement.requestFullscreen && !document.fullscreenElement) await document.documentElement.requestFullscreen({ navigationUI: "hide" }); } catch {}
  const r = await api("/api/hd/start", { pid }).catch(() => null);
  if (r && r.ok) { lastSig = ""; poll(); }
}
async function hdMark(ok) {
  if (hd.busy || !hd.word || Date.now() < hd.ready || Date.now() >= hd.end) return;
  hd.busy = true; hd.armed = false;
  hdFlash(ok);
  const r = await api("/api/hd/mark", { pid, ok, n: hd.n }).catch(() => null);
  if (r && r.ok) { hd.word = r.word; hd.n = r.n; }
  hd.busy = false;
  setTimeout(hdPaint, Math.max(0, hd.flashUntil - Date.now()));
}
function hdFlash(ok) {
  const f = document.getElementById("hd-face");
  if (!f) return;
  buzz(ok ? 80 : [40, 60, 40]);
  hd.flashUntil = Date.now() + 700;
  f.dataset.flash = ok ? "ok" : "pass";
  f.querySelector(".hd-word").textContent = ok ? "Угадано! ✓" : "Пропуск";
}
function hdPaint() {
  const f = document.getElementById("hd-face");
  if (!f || Date.now() < hd.flashUntil) return;
  const left = Math.max(0, (hd.end - Date.now()) / 1000), wait = (hd.ready - Date.now()) / 1000;
  f.dataset.flash = "";
  const w = f.querySelector(".hd-word"), text = wait > 0 ? `Приложи ко лбу\n${Math.ceil(wait)}` : hd.word || "";
  if (w.textContent !== text) { w.textContent = text; w.style.fontSize = ""; fitWord(w); }
  f.querySelector(".hd-left").textContent = wait > 0 ? "" : Math.ceil(left);
  f.querySelector(".hd-bar i").style.width = (wait > 0 ? 100 : (left / hd.total) * 100) + "%";
}
function fitWord(w) { // слово во всю ширину, но целиком
  let size = Math.min(innerWidth / 5, innerHeight / 3);
  w.style.fontSize = size + "px";
  while (size > 18 && (w.scrollWidth > w.clientWidth || w.scrollHeight > w.clientHeight)) { size *= 0.9; w.style.fontSize = size + "px"; }
}
function onTilt(e) {
  if (e.beta == null || !document.getElementById("hd-face")) return;
  const v = Math.cos(e.beta * Math.PI / 180) * Math.cos(e.gamma * Math.PI / 180);
  if (Math.abs(v) < 0.4) hd.armed = true; // телефон снова прямо — можно следующий наклон
  else if (hd.armed && Math.abs(v) > 0.7) hdMark(v < 0);
}
window.addEventListener("deviceorientation", onTilt);
function hdFace(c, me, seconds) {
  let f = document.getElementById("hd-face");
  if (!c) {
    if (f) { f.remove(); clearInterval(hd.timer); try { hd.wake && hd.wake.release(); } catch {} hd.wake = null; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
    return;
  }
  hd.total = seconds; hd.end = Date.now() + c.left * 1000; hd.ready = Date.now() + (c.ready_left || 0) * 1000;
  if (!hd.busy && me.n >= hd.n) { hd.n = me.n; hd.word = me.word || hd.word; }
  if (!f) {
    f = document.createElement("div"); f.id = "hd-face";
    f.innerHTML = `<div class="hd-bar"><i></i></div><span class="hd-left"></span><div class="hd-word"></div>
      <button type="button" class="hd-zone up" aria-label="Угадал">✓ угадал</button><button type="button" class="hd-zone down" aria-label="Пропустить">пропуск</button>`;
    document.body.appendChild(f);
    f.querySelector(".up").addEventListener("pointerdown", (e) => { e.preventDefault(); hdMark(true); });
    f.querySelector(".down").addEventListener("pointerdown", (e) => { e.preventDefault(); hdMark(false); });
    hd.armed = false; clearInterval(hd.timer); hd.timer = setInterval(hdPaint, 200);
  }
  hdPaint();
}

// размер слова на карточке: самое длинное слово фразы — в одну строку, без переноса посреди слова
const cardSize = (w) => Math.round(Math.min(54, (Math.min(innerWidth, 560) - 70) / (0.66 * Math.max(...w.split(" ").map((x) => x.length)))));

function renderHd(s, me) {
  const h = s.hd, c = h.cur || {}, m = h.me || {};
  mood("");
  const teamMode = !!s.settings.teams, ours = !teamMode || m.team === c.team;
  const tb = teamMode && c.team != null ? ` <span class="teambadge" style="--c:${TEAM_COLORS[c.team]}">${esc(s.team_names[c.team])}</span>` : "";
  const who = `${avaP(c)} <b>${esc(c.name)}</b>${tb}`;
  const turnLabel = teamMode ? `Круг ${h.round} из ${h.rounds}` : `Ход ${h.turn + 1} из ${h.turns}`;
  if (s.phase === "hd_turn") {
    $main.innerHTML = m.is_guesser
      ? `<div class="scene"><div class="eyebrow">${turnLabel}</div><h1>Твой ход! 🙆</h1>
          <ol class="hd-howto"><li>Нажми «Старт» и приложи телефон ко лбу — экраном к ${teamMode ? "своей команде" : "друзьям"}</li>
            <li>${teamMode ? "Команда объясняет" : "Друзья объясняют"} слово, не называя его</li><li>Угадал — наклони телефон <b>вниз</b>, не знаешь — <b>вверх</b></li></ol>
          <p class="muted">${h.seconds} секунд. Если наклоны не срабатывают — касайся верха или низа экрана</p>
          <button class="btn big-btn" id="hd-start" type="button">▶ Старт</button></div>`
      : `<div class="scene"><div class="eyebrow">${turnLabel}</div><h2>Угадывает ${who}</h2>
          <p class="muted">${ours ? "Сейчас приложит телефон ко лбу. Объясняй слова, не называя их, — слово будет и у тебя на экране"
            : "Ход соперников: объясняют они, а ты следи, чтобы не называли само слово"}</p></div>`;
    const b = document.getElementById("hd-start");
    if (b) b.addEventListener("click", () => { b.disabled = true; b.textContent = "…"; hdStart().finally(() => { b.disabled = false; b.textContent = "▶ Старт"; }); });
  } else if (s.phase === "hd_play") {
    if (m.is_guesser) {
      $main.innerHTML = `<div class="scene"><h2>Телефон — ко лбу!</h2></div>`;
      return hdFace(c, m, h.seconds);
    }
    const timebar = c.left != null ? `<div class="timebar" style="width:100%"><i style="animation-duration:${c.left}s"></i></div>` : "";
    $main.innerHTML = `<div class="scene"><div class="eyebrow">Угадывает ${esc(c.name)} · угадано ${c.ok}</div>${tb}${timebar}
      ${m.word ? `<div class="hd-card ${ours ? "" : "rival"}" style="font-size:${cardSize(m.word)}px">${esc(m.word)}</div><p class="muted">${ours ? "Объясняй, не называя слово и однокоренные" : "Объясняют соперники — следи, чтобы не называли слово"}</p>`
        : `<div class="hd-card wait">Приготовьтесь…</div>`}</div>`;
  } else if (s.phase === "hd_result") {
    const words = (c.words || []).map((w) => `<li class="${w.ok ? "ok" : "no"}">${w.ok ? "✓" : "✗"} ${esc(w.word)}</li>`).join("");
    const mineNext = h.next && h.next === me.name;
    $main.innerHTML = `<div class="scene"><div class="eyebrow">${turnLabel}</div>
      <h2>${who}: ${wordsN(c.ok)}</h2>${words ? `<ul class="hd-list">${words}</ul>` : ""}
      ${teamMode ? `<p class="muted">Счёт: ${s.teams.map((x) => `<span class="teambadge" style="--c:${TEAM_COLORS[x.team]}">${esc(x.name)} ${x.score}</span>`).join(" ")}</p>` : ""}
      ${mineNext ? `<p class="pill">Следующий ход — твой! Готовься 🙆</p>` : h.next ? `<p class="muted">Следующий: ${esc(h.next)}</p>` : `<p class="muted">Это был последний ход</p>`}</div>`;
  }
}

function draw(s) {
  const me = s.me;
  if (!me) { pid = null; save(null); joinForm(); return; }
  document.getElementById("top").innerHTML = `${avaP(me)}<span class="nm">${esc(me.name)}</span>${speaker(s) && window.QuizMusic ? `<button class="sound-btn" id="phone-sound" type="button" aria-label="Звук">${QuizMusic.muted ? "🔇" : "🔊"}</button>` : ""}<span class="sc">${me.score}</span>`;
  soundtrack(s);
  mood("");
  confetti(false);

  const scene = s.phase + ":" + s.index;
  $main.classList.toggle("calm", scene === lastScene); lastScene = scene;
  if (s.phase.startsWith("si_")) return renderSi(s, me);
  if (s.phase.startsWith("fd_")) return renderFd(s, me);
  if (s.phase !== "hd_play") hdFace(null);
  if (s.phase.startsWith("hd_")) return renderHd(s, me);
  const myTeam = me.team != null ? s.team_names[me.team] : null;
  if (s.phase === "setup") {
    $main.innerHTML = `
      <div class="scene">
        <span class="pop">${avaP(me, "xl")}</span>
        <h1 class="rise">Ты в игре!</h1>
        <div class="spinner"></div>
