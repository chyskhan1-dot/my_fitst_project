<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка звука</title>
<style>
  body { margin: 0; font: 600 22px/1.4 system-ui, sans-serif; background: #12163a; color: #f4f5ff; padding: 32px; }
  h1 { margin: 0 0 8px; font-size: 40px; }
  p { margin: 0 0 18px; color: #c9cdf2; }
  .tests { display: flex; flex-direction: column; gap: 16px; max-width: 760px; }
  button { font: 800 26px system-ui, sans-serif; padding: 20px 26px; border-radius: 16px; border: 4px solid transparent; background: #ffd23f; color: #1b1b1b; text-align: left; cursor: pointer; }
  button:focus { border-color: #fff; outline: none; transform: scale(1.02); }
  button small { display: block; font-weight: 600; font-size: 18px; }
  #info { margin-top: 24px; font: 16px/1.5 monospace; white-space: pre-wrap; color: #a7aedb; background: #0b0e27; padding: 14px; border-radius: 12px; max-width: 760px; }
</style>
</head>
<body>
<h1>🔊 Проверка звука</h1>
<p>Нажмите кнопки по очереди (пультом — стрелки и «ОК») и скажите, после каких был слышен звук.</p>
<div class="tests">
  <button id="t1" autofocus>1. Музыка игры<small>как играет квиз</small></button>
  <button id="t2">2. Простой сигнал «пиии»<small>тот же способ, но самый простой звук</small></button>
  <button id="t3">3. Сигнал другим способом<small>обычный аудиофайл, как в видео</small></button>
  <button id="stop">⏹ Остановить</button>
</div>
<div id="info">Собираю сведения…</div>
<script src="/static/music.js"></script>
<script>
const $info = document.getElementById("info");
const lines = [];
const log = (s) => { lines.push(s); $info.textContent = lines.join("\n"); };
const AC = window.AudioContext || window.webkitAudioContext;
log("Браузер: " + navigator.userAgent);
log("Web Audio: " + (AC ? "есть" : "НЕТ"));
log("Музыка игры загрузилась: " + (window.QuizMusic ? "да" : "НЕТ"));
window.addEventListener("error", (e) => log("Ошибка: " + e.message));
let ctx2 = null, osc = null, el = null;

document.getElementById("t1").onclick = () => {
  try {
    QuizMusic.unlock(); QuizMusic.stop(0); QuizMusic.play("lobby");
    setTimeout(() => log("1) музыка: " + (QuizMusic.blocked ? "звук ЗАКРЫТ браузером" : "играет «" + QuizMusic.styleName + "»")), 1500);
  } catch (e) { log("1) ошибка: " + e.message); }
};
document.getElementById("t2").onclick = () => {
  try {
    ctx2 = ctx2 || new AC();
    if (ctx2.resume) ctx2.resume();
    osc = ctx2.createOscillator(); const g = ctx2.createGain(); g.gain.value = 0.3;
    osc.frequency.value = 440; osc.connect(g); g.connect(ctx2.destination);
    osc.start(); osc.stop(ctx2.currentTime + 1.5);
    setTimeout(() => log("2) простой сигнал: состояние " + ctx2.state + ", частота " + ctx2.sampleRate + " Гц"), 300);
  } catch (e) { log("2) ошибка: " + e.message); }
};
document.getElementById("t3").onclick = () => {
  // короткий WAV «пиии» собираем прямо здесь и играем обычным <audio>
  const rate = 22050, n = rate * 1.5, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 660 * i / rate) * 9000, true);
  el = new Audio(URL.createObjectURL(new Blob([buf], { type: "audio/wav" })));
  el.play().then(() => log("3) аудиофайл: играет")).catch((e) => log("3) аудиофайл: ошибка " + e.message));
};
document.getElementById("stop").onclick = () => {
  try { QuizMusic.stop(0.2); } catch {}
  try { if (osc) osc.stop(); } catch {}
  if (el) el.pause();
};
</script>
</body>
</html>
