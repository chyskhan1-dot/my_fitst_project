services:
  - type: web
    name: quiz
    runtime: python
    plan: free
    rootDir: quiz
    buildCommand: python --version
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: STATS_KEY  # ключ к странице статистики /stats?key=…; Render придумает его сам
        generateValue: true
